# EBench bridge configuration template. single_eval.sh / multi_eval.sh read
# these defaults and patch host/port/worker at runtime (never edit machine
# paths into this file — CONTRIBUTING.md config policy).

# --- GenManip eval server (north) ---
# Local server: http://<host>:8087 (ray_eval_server.py).
# Official online eval: the per-task endpoint from `gmp online submit`
# (https://internrobotics.shlab.org.cn/eval), plus your API token; run_id must
# equal the online task_id.
url: "http://127.0.0.1:8087"
token: ""
run_id: ""
worker_id: "0"

# --- OpenWAM Policy Server (south) ---
# One OpenWAM server per worker (the server-side action executor is stateful
# per episode). multi_eval.sh assigns port = south_port_base + worker index.
south_host: "127.0.0.1"
south_port: 8848
request_timeout: 300      # seconds per south inference round-trip

# --- Action settings ---
# Must match the checkpoint's dataloader.base_action_source:
#   delta      -> base_motion = per-step [dx_m, dy_m, dyaw_deg], base_is_rel=true
#   cumulative -> base_motion = absolute [x_m, y_m, yaw_deg],   base_is_rel=false
base_mode: delta

# --- Observation settings ---
send_state: true          # RAW-23 proprio; required for proprio-conditioned ckpts
save_process: false       # EvalClient-side per-episode video/log dump (slower)

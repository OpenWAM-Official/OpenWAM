# OpenWAM RoboCasa365 native-action benchmark client config.
host: 127.0.0.1
port: 8848
request_timeout: 300

split: pretrain
task: OpenDrawer
num_trials: 5
# Official benchmark horizon is read at runtime from RoboCasa's
# get_task_horizon(task). Set this only for a deliberately shortened smoke run.
max_steps_override: null
seed: 0

head_camera_key: video.robot0_agentview_left
left_wrist_camera_key: video.robot0_eye_in_hand
# This is an agent view, but it is transported in OpenWAM's fixed bottom-right
# "right_wrist_camera" image slot to match the training L-shape layout.
right_wrist_camera_key: video.robot0_agentview_right
image_transform: none

# Used for debug breakdown. The transmitted policy state is always compact 19-D:
# EEF xyz3 + rot6d6 + gripper1 + base xyz3 + rot6d6.
state_keys:
  - state.base_position
  - state.base_rotation
  - state.end_effector_position_relative
  - state.end_effector_rotation_relative
  - state.gripper_qpos
state_dim: 19

# RoboCasaGymEnv consumes native action12. The policy server returns compact
# native-delta action15; the client converts rot6d back to the original 3-D
# normalized rotation vector and restores the gripper sign.
action_dim: 12

debug: false
debug_dir: ./debug_robocasa365

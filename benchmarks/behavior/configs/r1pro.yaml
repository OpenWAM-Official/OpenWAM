# R1Pro controller config for the BEHAVIOR-1K challenge submission.
#
# Drop-in replacement for OmniGibson's learning/configs/robot/r1pro.yaml. The
# eval driver merges this `controllers:` block over the robot-class defaults
# (`eval.py`: `controller_config.update(cfg.robot.controllers)`).
#
# Why we override the arms: the OpenWAM checkpoint predicts END-EFFECTOR poses
# (unified 80-D, rot6d), NOT joint angles. So both arms run an
# InverseKinematicsController in `absolute_pose` mode and OmniGibson does the IK
# for us — the bridge feeds base-frame xyz + absolute axis-angle (6-D/arm). The
# base / trunk / grippers keep the demo controllers (the model reproduces their
# native recorded commands), so those channels pass straight through.
#
# Executed action vector (controller order == r1.py `_raw_controller_order`),
# 21-D with IK arms:
#   [ base(3), trunk(4), arm_left(6: xyz+axisangle), gripper_left(1),
#     arm_right(6: xyz+axisangle), gripper_right(1) ]
# Grippers are INTERLEAVED (gripper_left right after arm_left), not appended.

type: R1Pro

multi_view_cameras:
  head:
    name: robot_r1::robot_r1:zed_link:Camera:0
    resolution: [240, 240]
  left_wrist:
    name: robot_r1::robot_r1:left_realsense_link:Camera:0
    resolution: [240, 240]
  right_wrist:
    name: robot_r1::robot_r1:right_realsense_link:Camera:0
    resolution: [240, 240]

action_keys: [base, torso, left_arm, left_gripper, right_arm, right_gripper]
action_key_dims:
  base: 3
  torso: 4
  left_arm: 6 # IK absolute_pose: xyz(3) + axis-angle(3)
  left_gripper: 1
  right_arm: 6
  right_gripper: 1

controllers:
  base:
    name: HolonomicBaseJointController
    motor_type: velocity
    vel_kp: 150
    command_input_limits: default # (-1, 1) normalized → scaled to base vel limits
    command_output_limits: default # [[-0.75,-0.75,-1], [0.75,0.75,1]]
    use_impedances: false
  trunk:
    name: JointController
    motor_type: position
    pos_kp: 150
    command_input_limits: default # (-1, 1) normalized → scaled to torso joint limits
    command_output_limits: default
    use_impedances: false
    use_delta_commands: false # absolute joint targets (matches the demos)
  arm_left:
    name: InverseKinematicsController
    mode: absolute_pose # command = base-frame [x, y, z, ax, ay, az]
    motor_type: position
    command_input_limits: null # REQUIRED null for absolute_pose (raw metric pose)
    command_output_limits: null # REQUIRED null for absolute_pose
    use_impedances: false
  arm_right:
    name: InverseKinematicsController
    mode: absolute_pose
    motor_type: position
    command_input_limits: null
    command_output_limits: null
    use_impedances: false
  gripper_left:
    name: MultiFingerGripperController
    mode: smooth # 1-D command, broadcast to both finger joints; +1 open / -1 close
    command_input_limits: default
    command_output_limits: default
  gripper_right:
    name: MultiFingerGripperController
    mode: smooth
    command_input_limits: default
    command_output_limits: default

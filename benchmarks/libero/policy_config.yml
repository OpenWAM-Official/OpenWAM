# OpenWAM LIBERO benchmark client config.
#
# This file is a template. `single_eval.sh` patches host/port at runtime; all
# other fields can be overridden by copying the file and passing
# `POLICY_CONFIG_PATH=/path/to/custom.yml`.

policy_name: openwam

# OpenWAM policy server connection.
host: "127.0.0.1"
port: 8848
request_timeout: 300


# Benchmark task selection.
suite: libero_spatial
task_id: 0
num_trials: 1
max_steps: 600
settle_steps: 10
seed: 0
fail_on_incomplete: false

# Offscreen rendering.
camera_height: 128
camera_width: 128

# Observation mapping from LIBERO obs dict to OpenWAM's fixed camera contract.
head_camera_key: agentview_image
left_wrist_camera_key: robot0_eye_in_hand_image
right_wrist_camera_key: null

# Standard LIBERO/OpenVLA evaluation rotates offscreen robosuite images by 180
# degrees before policy input. Set to `none` only for checkpoints trained on raw
# unrotated LIBERO frames.
image_transform: rotate_180

# Action handling.
#   eef    - the checkpoint predicts the raw 10-D EEF pose [xyz3, rot6d6, grip1]
#            (unified 80-D gathered/denormalized server-side); the client sends
#            the EEF10 proprio and converts the returned full pose to the env's
#            native 7-D OSC delta using the live controller scales.
#   native - legacy 7-D OSC passthrough for checkpoints trained on raw actions.
action_mode: eef

# Proprioception. EEF checkpoints REQUIRE the 10-D EEF proprio; the client
# assembles it from robot0_eef_pos / robot0_eef_quat / robot0_gripper_qpos
# (state_keys is only used by action_mode: native).
send_state: true
state_keys:
  - robot0_eef_pos
  - robot0_eef_quat
  - robot0_gripper_qpos
state_dim: 10

# LIBERO environments execute 7-D single-arm OSC delta actions.
action_dim: 7
action_indices: null
action_clip: null

# robosuite OSC_POSE output_max (metres / radians per unit action). null lets
# the client probe the live env controller (falls back to 0.05 / 0.5).
osc_pos_scale: null
osc_rot_scale: null

debug: false
debug_dir: "./debug_libero"

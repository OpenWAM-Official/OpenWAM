# Per-task step_lim overrides for RoboTwin evaluation.
#
# Format: <task_name>: <int>
#
# Semantics:
#   - Any task listed here overrides RoboTwin's upstream
#     task_config/_eval_step_limit.yml value for that task.
#   - Tasks NOT listed here keep RoboTwin's original value (or its
#     built-in fallback of 1000 when the upstream file also lacks
#     the task).
#   - Override is applied by `openwam2robotwin_interface.py` at the
#     start of every episode, so you can tweak a number and rerun
#     without touching the RoboTwin source tree.
#
# Note: This is for evaluation not training.
#
# Each value is `ceil(avg / 32) * 32`. The `# avg N` comment on each line
# preserves the raw per-task mean step count from the earlier step-analysis
# pass (see `benchmarks/robotwin/analyze_steps.py` in git history for the
# exact methodology) before rounding. Because it's a central-tendency
# estimate — not a ceiling — a non-trivial fraction of rollouts will run
# longer than `avg`.
#
# The headroom between `avg` and its `ceil(/32)*32` bucket can be as small
# as a single step (e.g. `turn_switch` avg 95 -> 96, `handover_mic` avg
# 223 -> 224). The 32-step rounding is *not* a safety margin. If a task
# starts to hit `step limit reached` during eval, bump its value here
# manually — e.g. round up to the next bucket, or double it for tasks
# where avg and max are known to diverge.

# NOTE: All per-task overrides below are commented out by default, so no
# step_lim override is applied and every task keeps RoboTwin's upstream
# value. Uncomment a line to re-enable that task's override.

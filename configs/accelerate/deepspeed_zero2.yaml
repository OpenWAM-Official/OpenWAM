# Accelerate config for DeepSpeed ZeRO Stage 2.
#
# Usage:
#   accelerate launch --config_file configs/accelerate/deepspeed_zero2.yaml \
#       scripts/train.py training=deepspeed_zero2 ...
#
# See https://huggingface.co/docs/accelerate/usage_guides/deepspeed

compute_environment: LOCAL_MACHINE
distributed_type: DEEPSPEED
num_machines: 1
num_processes: 2
mixed_precision: bf16

deepspeed_config:
  zero_stage: 2
  gradient_accumulation_steps: 4
  gradient_clipping: 1.0
  offload_optimizer_device: none
  offload_param_device: none
  zero3_init_flag: false
  zero3_save_16bit_model: false

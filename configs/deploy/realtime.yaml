# Real-time deployment configuration (DreamZero-inspired)
# Combines multiple optimizations for low-latency action inference.

deploy:
  # DiT velocity caching
  dit_cache:
    enabled: true
    cosine_threshold: 0.99
    max_consecutive_skips: 3

  # TeaCache (timestep embedding caching, built into diffsynth)
  tea_cache:
    enabled: true
    l1_thresh: 0.3

  # Classifier-Free Guidance optimization
  cfg:
    mode: batch_merge    # "batch_merge" (single GPU) or "parallel" (multi-GPU)
    scale: 1.0           # Set > 1.0 to enable CFG
    parallel_devices: ["cuda:0", "cuda:1"]  # For mode=parallel

  # Decoupled schedule (DreamZero-Flash)
  schedule:
    type: decoupled_flash
    action_steps: 1      # 1-4 steps for action denoising
    shift: 5.0

  # Async closed-loop execution
  async_execution:
    enabled: true
    prefetch: true
    chunk_size: 49

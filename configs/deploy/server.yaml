# Policy server deployment configuration
# Loaded by deployment code that constructs `open_wam.serving.PolicyServer`.

server:
  host: "0.0.0.0"
  ws_port: 8765
  http_port: 8766

# Embodiment for action space conversion (null = raw actions)
embodiment: null

policy:
  history_len: 10
  execute_horizon: 8
  temporal_ensemble: true
  ensemble_decay: 0.5

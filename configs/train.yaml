defaults:
  - accelerate: deepspeed_zero2   # [Optional]: deepspeed_zero1, deepspeed_zero2(default), deepspeed_zero3
  - model: dual_system            # [Optional]: dual_system(default), shared_backbone, tri_system
  - dataloader: robotwin          # [Optional]: robotwin(default)
  - _self_

training:
  # --- Debug ---
  debug: false                    # Debug mode: max_steps=20, save@10, constant LR

  # --- Optimizer ---
  learning_rate: 1e-4             # Base learning rate for AdamW
  adam_betas: [0.9, 0.95]         # AdamW (beta1, beta2)
  weight_decay: 0.01              # AdamW weight decay
  max_grad_norm: 1.0              # Gradient clipping max norm

  # --- Schedule ---
  num_epochs: 5                   # Total training epochs
  max_steps: null                 # Early stop after N steps (null = no limit)
  batch_size: 24                   # Per-GPU batch size
  gradient_accumulation_steps: 1  # Accumulate N micro-batches before optimizer step

  # --- LR scheduler ---
  lr_scheduler: cosine            # cosine with linear warmup; null = constant LR
  warmup_ratio: 0.05              # Fraction of total steps for linear warmup
  lr_min_ratio: 0.01              # Minimum LR as fraction of learning_rate

  # --- Per-module LR (null = use base learning_rate) ---
  action_lr: null                 # Override LR for action model parameters
  video_lr: null                  # Override LR for video backbone parameters

  # --- Memory optimization ---
  use_gradient_checkpointing: true       # Trade compute for memory in DiT blocks
  use_gradient_checkpointing_offload: false  # Offload checkpointed activations to CPU
  initialize_model_on_cpu: false         # Load model on CPU, let DeepSpeed move to GPU

  # --- Loss weights ---
  lambda_video: 1.0               # Video flow-matching loss weight
  lambda_action: 1.0              # Action flow-matching loss weight

  # --- Flow matching timestep range ---
  max_timestep_boundary: 1.0      # Upper bound (fraction of total timesteps)
  min_timestep_boundary: 0.0      # Lower bound (fraction of total timesteps)

  # --- LoRA ---
  lora_base_model: null           # Pipeline sub-module to apply LoRA (e.g. "dit"); null = no LoRA
  lora_target_modules: "q,k,v,o,ffn.0,ffn.2"  # Comma-separated target module names
  lora_rank: 32                   # LoRA rank
  lora_lr: null                   # Override LR for LoRA parameters

  # --- Checkpoint ---
  output_path: /path/to/openwam_checkpoints           # Base directory for checkpoint output
  save_steps: 2000                # Save checkpoint every N steps
  keep_last_k_ckpts: 1           # Rolling window: keep only the last K checkpoints

  # --- Data loading ---
  dataset_num_workers: 8          # DataLoader num_workers (0 = main process)

project:
  name: open-wam
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  seed: 42
  wandb:
    project: open-wam
    run_name: null
    entity: null

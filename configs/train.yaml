defaults:
  - accelerate: deepspeed_zero2
  - model: dual_system
  - model/video_backbone: ti2v_5b
  - model/action_backbone: action_dit_small
  - model/bridge: cross_attn_detach
  - dataloader: robotwin
  - training_strategy: joint
  - _self_

# Training hyperparams (absorbed from old training/joint.yaml)
training:
  learning_rate: 1e-4
  weight_decay: 0.01
  max_grad_norm: 1.0
  num_epochs: 5
  max_steps: null
  batch_size: 1
  gradient_accumulation_steps: 4
  use_gradient_checkpointing: true
  use_gradient_checkpointing_offload: false
  max_timestep_boundary: 1.0
  min_timestep_boundary: 0.0
  find_unused_parameters: false
  # Model loading
  model_paths: null
  tokenizer_path: null
  initialize_model_on_cpu: false
  # LoRA
  lora_base_model: null
  lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
  lora_rank: 32
  lora_checkpoint: null
  preset_lora_path: null
  preset_lora_model: null
  trainable_models: null
  # FP8 & offload
  fp8_models: null
  offload_models: null
  # Checkpointing
  output_path: ./models
  save_steps: 2000
  keep_last_k_ckpts: 3
  dataset_num_workers: 0
  # LR scheduler
  lr_scheduler: cosine
  warmup_ratio: 0.05
  lr_min_ratio: 0.01
  # Per-module LR
  action_lr: null
  video_lr: null
  lora_lr: null
  # Debug
  debug: false

project:
  name: open-wam
  output_dir: outputs/${now:%Y-%m-%d_%H-%M-%S}
  seed: 42
  wandb:
    project: open-wam
    run_name: null
    entity: null

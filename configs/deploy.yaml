# --- Base deploy settings ---
checkpoint_path: null          # Default checkpoint dir; --ckpt-dir overrides
device: cuda:0
server:
  host: "0.0.0.0"
  port: 8848                   # WebSocket port

# --- Inference (cfg.inference) ---
# Every field has a same-name CLI override (--denoise-steps, --inference-mode, ...).
inference:
  denoise_steps: 10
  denoise_mode: sync          # trajectory: sync | async; separate from inference_mode
  lead_modality: video        # denoise_mode=async: action | video
  variance_shift_alpha: 1.0   # denoise_mode=async: lead curve shift; >= 1
  linear_offset: 0.0          # denoise_mode=async: lag start delay; 0 <= value < 1

  inference_mode: sync        # executor: sync | async; separate from denoise_mode
  inference_horizon: null     # inference_mode=async: actions per chunk; null = policy.execute_horizon
  inference_delay_steps: null # inference_mode=async: latency in steps

# --- Deploy-time optimizations (cfg.optimization) ---
optimization:
  decode_video: false         # false = skip VAE decode, return video=null (actions-only)

  dit_cache:
    enabled: false            # DiT velocity cache: skip video DiT when prediction is stable
    cosine_threshold: 0.99    # Skip if cosine similarity to previous prediction exceeds this
    max_skips: 3              # Max consecutive skips before forcing recompute

  compile:
    enabled: true             # true enables architecture-specific compile fast paths
    self_attn:
      torch_mode: default
      dynamic: false           # Fixed-shape MoT-loop compile for dual_system_self_attn
    cross_attn:
      torch_mode: default
      dynamic: false           # Action-side fast path for dual_system_cross_attn
    idm:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape IDM video/action fast paths
      video_loop:
        enabled: true
      action_cache:
        enabled: true
    tri_system:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape trimodal MoT-loop compile for tri_system_joint_self_attn

  prompt_embed_cache:
    maxsize: 32               # LRU cap for prompt -> text embeddings cache

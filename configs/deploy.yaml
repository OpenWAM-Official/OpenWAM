# ---------------------------------------------------------------------------
# Base deploy settings
# ---------------------------------------------------------------------------
checkpoint_path: null          # Default checkpoint directory; --ckpt-dir on the CLI overrides this.
device: cuda:0
server:
  host: "0.0.0.0"
  ws_port: 8850
  http_port: 8848

# ---------------------------------------------------------------------------
# Inference parameters
# These populate cfg.inference and are used by JointInferenceEngine.generate().
# CLI flags --denoise-steps / --schedule-type etc. override these values.
# ---------------------------------------------------------------------------
inference:
  denoise_steps: 10           # Denoising steps (FastWAM-Joint deploy default)
  schedule_type: sync         # sync | video_leading | cascade | action_only | decoupled_flash | decoupled_asymmetric
  shift: 5.0                  # Flow-matching shift parameter

# ---------------------------------------------------------------------------
# Deploy-time optimizations
# Read by JointInferenceEngine._init_optimizations() via cfg.optimization.
# ---------------------------------------------------------------------------
optimization:
  decode_video: false         # Set false to skip VAE decode (action-only mode)

  schedule:
    type: null                # Override inference.schedule_type at deploy time (null = use inference.schedule_type)
    action_steps: 4           # Action denoising steps for decoupled_flash / decoupled_asymmetric schedules

  dit_cache:
    enabled: false            # DiT velocity cache: skip video DiT when prediction is stable
    cosine_threshold: 0.99    # Skip if cosine similarity to previous prediction exceeds this
    max_skips: 3              # Maximum consecutive skips before forcing recompute

  compile:
    mode: default              # none | default | mot_loop
    default:
      enabled: true            # torch.compile ActionDiT in the default strategy
      video_dit: true          # torch.compile Video DiT blocks (long warmup)
      vae: false               # torch.compile VAE decoder; usually unnecessary when decode_video=false
      torch_mode: null         # torch.compile mode for the default path
      dynamic: true            # Preserve the previous broad-compile dynamic=True behavior
    mot_loop:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape loop compile is the fast path

  prompt_embed_cache:
    maxsize: 32               # LRU cap for prompt -> text embeddings cache

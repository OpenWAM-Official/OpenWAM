# ---------------------------------------------------------------------------
# Base deploy settings
# ---------------------------------------------------------------------------
checkpoint_path: null          # Default checkpoint directory; --ckpt-dir on the CLI overrides this.
device: cuda:0
server:
  host: "0.0.0.0"
  port: 8848                   # WebSocket port

# ---------------------------------------------------------------------------
# Inference parameters
# These populate cfg.inference and are used by JointInferenceEngine.generate().
# CLI flags --denoise-steps / --schedule-type etc. override these values.
# ---------------------------------------------------------------------------
inference:
  denoise_steps: 10           # Denoising steps (FastWAM-Joint deploy default)
  schedule_type: sync         # only "sync" is supported (removed strategies live in git history)
  shift: 5.0                  # Flow-matching shift parameter
  execution_mode: sync        # sync | async — selects SyncInferenceExecutor / AsyncInferenceExecutor
  execution_horizon: null     # async only: actions executed per chunk before switching; null = policy.execute_horizon, else full chunk
  inference_delay_steps: null # async only: expected inference latency in steps; null = half of resolved horizon
  # §15 — Classifier-Free Guidance (Cosmos25 only today; Wan keeps its own
  # pipeline-internal CFG). When cfg_scale > 1.0 the engine resolves an
  # uncond embedding once at init (offline `empty.safetensors` if
  # `text_embedding_cache_dir` is set, otherwise the backbone's live encoder
  # via `text_encoder('')`). cfg_scale=1.0 is a strict no-op for backward
  # compatibility — Wan's existing CFG and existing Cosmos25 smoke paths are
  # both unaffected.
  cfg_scale: 1.0              # >=1.0; 1.0 disables CFG entirely. Cosmos uses 1.5 default in its upstream training callbacks.
  cfg_merge: false            # false (default): 2 sequential forwards per step. true: stack [uncond, cond] as B=2 in 1 forward (~1.5× faster, ~2× memory peak).
  # Path to the precomputed Reason1 cache produced by
  # `openwam.dataloader.reason1_embedding_computation`. Must contain
  # `empty.safetensors` AND a bucketed `<sha[:2]>/<sha256(prompt)>.safetensors`
  # for every prompt the deployed model receives at inference time. Legacy flat
  # `<sha>.safetensors` caches remain readable. A cache miss with cache_dir set
  # is a hard error — re-run precompute or unset this field.
  # Null = fall through to the live Reason1 encoder configured under
  # `video_backbone.text_encoder` in the checkpoint config. Use this when the
  # deployed model receives prompts the precompute set does not enumerate
  # (e.g. RoboTwin eval, which fills instruction templates against runtime
  # SAPIEN params per episode).
  text_embedding_cache_dir: null

# ---------------------------------------------------------------------------
# Deploy-time optimizations
# Read by JointInferenceEngine._init_optimizations() via cfg.optimization.
# ---------------------------------------------------------------------------
optimization:
  decode_video: false         # Set false to skip VAE decode (action-only mode)

  dit_cache:
    enabled: false            # DiT velocity cache: skip video DiT when prediction is stable
    cosine_threshold: 0.99    # Skip if cosine similarity to previous prediction exceeds this
    max_skips: 3              # Maximum consecutive skips before forcing recompute

  compile:
    mode: auto                 # auto | none
    self_attn:
      torch_mode: default
      dynamic: false           # Fixed-shape MoT-loop compile for dual_system_self_attn
    cross_attn:
      torch_mode: default
      dynamic: false           # Action-side fast path for dual_system_cross_attn
    idm:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape IDM video/action fast paths
      video_loop:
        enabled: true
      action_cache:
        enabled: true
    tri_system:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape trimodal MoT-loop compile for tri_system_joint_self_attn

  prompt_embed_cache:
    maxsize: 32               # LRU cap for prompt -> text embeddings cache

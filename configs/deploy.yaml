# --- Base deploy settings ---
checkpoint_path: null          # Default checkpoint dir; --ckpt-dir overrides
device: cuda:0
server:
  host: "0.0.0.0"
  port: 8848                   # WebSocket port

# --- Inference (cfg.inference) ---
# Every field has a same-name CLI override (--denoise-steps, --execution-mode, ...).
inference:
  denoise_steps: 10           # Denoising steps (FastWAM-Joint default)
  schedule_type: sync         # Within one denoise pass: how video/action timesteps advance (NOT execution_mode below).
                              #   <sync>           both streams lockstep (default)
                              #   <variance_shift> Latent-Forcing ordered trajectory: one stream
                              #                    denoises earlier (curve, see vs_* below)
  # --- variance_shift (Latent-Forcing) only ---
  vs_lead: video              # which stream denoises first  <action> | <video>
  vs_alpha: 1.0               # lead-curve strength  (>1 leads; 1 = diagonal = sync)
  vs_offset: 0.0              # 0 = pure curve; >0 = delay the lagging stream's start (piecewise)

  execution_mode: sync        # sync | async — Sync/AsyncInferenceExecutor
  execution_horizon: null     # async only: actions per chunk; null = policy.execute_horizon
  inference_delay_steps: null # async only: inference latency in steps; null = half horizon

# --- Deploy-time optimizations (cfg.optimization) ---
optimization:
  decode_video: false         # false = skip VAE decode, return video=null (actions-only)

  dit_cache:
    enabled: false            # DiT velocity cache: skip video DiT when prediction is stable
    cosine_threshold: 0.99    # Skip if cosine similarity to previous prediction exceeds this
    max_skips: 3              # Max consecutive skips before forcing recompute

  compile:
    enabled: false             # true enables architecture-specific compile fast paths
    self_attn:
      torch_mode: default
      dynamic: false           # Fixed-shape MoT-loop compile for dual_system_self_attn
    cross_attn:
      torch_mode: default
      dynamic: false           # Action-side fast path for dual_system_cross_attn
    idm:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape IDM video/action fast paths
      video_loop:
        enabled: true
      action_cache:
        enabled: true
    tri_system:
      torch_mode: reduce-overhead
      dynamic: false           # Fixed-shape trimodal MoT-loop compile for tri_system_joint_self_attn

  prompt_embed_cache:
    maxsize: 32               # LRU cap for prompt -> text embeddings cache

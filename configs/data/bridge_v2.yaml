# Bridge V2 dataset configuration
# 60k trajectories, 7-DoF EEF delta actions, low-cost robot
# Download: huggingface-cli download lerobot/bridge --repo-type dataset

data:
  type: bridge_v2
  dataset_dir: /path/to/vla_data/bridge_v2
  num_frames: 49
  height: 480
  width: 832
  camera: image_0
  action_stats_path: null
  val_ratio: 0.1
  split: train
  robot: widowx

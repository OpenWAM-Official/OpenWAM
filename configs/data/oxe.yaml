# Open X-Embodiment (OXE) dataset configuration
# Loads a single OXE subset in LeRobot v2/v3 format
#
# Usage:
#   python train.py data=oxe data.dataset_dir=/path/to/fractal data.dataset_name=fractal
#
# For multi-subset training, use data=mixture with OXE entries.

type: oxe
dataset_dir: ???
dataset_name: fractal
num_frames: 49
height: 480
width: 832
split: train
camera: null            # null = auto-detect from dataset_name
action_key: null        # null = auto-detect from dataset_name
embodiment: null        # null = auto-detect from dataset_name
canonical_action_dim: 7
action_stats_path: null
val_ratio: 0.1
seed: 42

# Transform pipeline (optional — omit or set to null for default z-score normalization)
transforms: null

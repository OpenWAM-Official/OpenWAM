# DROID dataset configuration
# 76k demonstrations, 7-DoF EEF absolute actions, Franka Panda
# Download: huggingface-cli download lerobot/droid --repo-type dataset

data:
  type: droid
  dataset_dir: /path/to/vla_data/droid
  num_frames: 49
  height: 480
  width: 832
  camera: exterior_image_1_left
  action_type: absolute
  action_stats_path: null
  val_ratio: 0.1
  split: train
  robot: franka

  # Transform pipeline (optional — omit or set to null for legacy z-score path)
  # transforms:
  #   normalize:
  #     mode: q99             # q99 | min_max | mean_std | scale
  #     gripper_mode: binary  # binarize gripper dimension
  #     gripper_indices: [6]
  #   augmentation:
  #     random_crop:
  #       scale: [0.8, 1.0]
  #     color_jitter:
  #       brightness: 0.1
  #       contrast: 0.1
  #       saturation: 0.1
  transforms: null

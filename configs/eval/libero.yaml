# LIBERO benchmark evaluation configuration
# Supports libero_spatial, libero_object, libero_goal suites
# Install: pip install libero

type: libero
num_episodes: 20
max_steps_per_episode: 300
seed: 42
image_height: 256
image_width: 256

# Task suites to evaluate (list of: libero_spatial, libero_object, libero_goal)
task_suites:
  - libero_spatial

policy:
  history_len: 10
  execute_horizon: 8
  temporal_ensemble: true
  ensemble_decay: 0.5

# Calvin benchmark evaluation configuration
# Long-horizon task chaining: up to 5 subtasks per sequence
# See: https://github.com/mees/calvin

type: calvin
num_sequences: 1000
max_subtasks: 5
max_subtask_steps: 360
image_height: 200
image_width: 200

# "D_D" = seen scene, "ABC_D" = unseen scene transfer
split: D_D
dataset_path: ???

policy:
  history_len: 10
  execute_horizon: 8
  temporal_ensemble: true
  ensemble_decay: 0.5

type: online
num_episodes: 50
max_steps_per_episode: 500
env:
  name: robotwin
  task_name: null
  robot: arx-x5
policy:
  history_len: 10
  action_cache_size: 49
  # Receding-horizon execution (set to null for greedy/full-chunk mode)
  execute_horizon: 8
  # Temporal ensembling of overlapping predictions
  temporal_ensemble: true
  ensemble_decay: 0.5

# SharedBackbone MoE action backbone (cfg.model.action_backbone.*): action tokens
# share the video DiT + receive an expert FFN correction at expert_layers.
variant: moe
action_decoder_hidden_dim: 1024   # shared action decoder MLP width
expert_ffn_dim: 4096
# Which video layers get the expert FFN. len(expert_layers) sets num_experts.
# expert_layers: explicit list, OR null + expert_interval (1=all, 2=every other).
expert_layers: null
expert_interval: 1

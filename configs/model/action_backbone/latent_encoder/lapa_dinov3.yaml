# LAPA-DINOv3 latent-action target provider (cfg.model.action_backbone.latent_encoder.*).
# Only consumed when model.action_backbone.type=latent.
name: lapa_dinov3

paths:
  lapa_model_dir: /path/to/LAPA-DINOv3
  dinov3_model_dir: /path/to/dinov3-vitl16-pretrain-lvd1689m

input:
  image_size: 224

model:
  dim: 1024
  quant_dim: 32
  codebook_size: 8
  patch_size: 16
  spatial_depth: 4
  temporal_depth: 4
  dim_head: 64
  heads: 16
  code_seq_len: 16

output:
  tokens_per_pair: 16
  token_dim: 1024
  # Only flattened pair tokens are supported today; kept explicit so the action
  # sequence shape is visible in resolved configs.
  flatten_pairs: true
  action_dim: 1024

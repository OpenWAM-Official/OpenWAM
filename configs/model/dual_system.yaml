# Dual-System WAM: separate ActionDiT + video DiT. Variants:
#   joint_cross_attn: video runs to completion → bridge features → ActionDiT
#                     runs once with cross-attention to them.
#   joint_self_attn:  MoTJointDriver runs one mixed self-attention per layer;
#                     requires num_layers/num_heads/head_dim parity across backbones.
#   idm:              teacher-forcing training + two-stage inference. Wan-only
#                     (Cosmos25 raises NotImplementedError).
# Video backbone composed from the Hydra `video_backbone` group; CLI: model/video_backbone=cosmos25.

defaults:
  - video_backbone: wan   # CLI: model/video_backbone=cosmos25
  - _self_

# Frozen pretrained components (freeze_modules walks each via get_submodule;
# missing paths silently skipped — image_encoder None on TI2V/VACE, _encoder
# only on the from_scratch external-encoder path).
freeze:
  - video_backbone.text_encoder
  - video_backbone.vae
  - video_backbone.image_encoder
  - video_backbone.video_encoder

architecture:
  framework: dual_system
  variant: joint_self_attn   # joint_self_attn | joint_cross_attn | idm (idm = Wan only)
  action_dim: 20

  # When true, dataloader must provide sample["proprio"]; one proprio token is
  # appended to the text context before the backbones consume it.
  use_proprioception: true
  state_dim: 20                  # required when use_proprioception=true
  # Raw text/context dim shared by the video + action streams. Auto-resolves
  # from video_backbone.text_dim; 4096 = Wan T5-XXL, kept explicit.
  text_dim: 4096

  # ActionDiT layer selection. joint_cross_attn: which video layers feed the
  # bridge. joint_self_attn/idm: sizes ActionDiT (must match vb.num_layers).
  # bridge_layers: explicit list, OR null + bridge_interval (1=all, 2=every other).
  bridge_layers: null
  bridge_interval: 1

  # MoT options (joint_self_attn / idm only; ignored by joint_cross_attn).
  mot_checkpoint_mixed_attn: true       # grad-checkpoint the mixed attention (VRAM ↓, +1 recompute/layer)
  # joint mask: v↔v from video_attention_mask_mode, a↔a True, a→v True, v→a False.
  # idm fixes this to `joint` internally — do not override for idm.
  attention_mask_mode: joint   # joint | bidirectional
  # v↔v block layout; idm also uses it for the teacher-forcing + cache-prefill submasks.
  video_attention_mask_mode: first_frame_causal   # first_frame_causal | per_frame_causal | bidirectional

  detach_bridge: false             # joint_cross_attn only
  idm_video_cond_noise_prob: 0.5   # idm only

# ActionDiT. Geometry auto-resolved from video_backbone (num_layers/video_dim/
# num_heads/attn_head_dim); joint_self_attn/idm hard-require head parity.
# Raw context width comes from architecture.text_dim above (shared with the
# video stream) — do NOT set text_dim here.
# Struct mode needs `+` for the absent num_heads/attn_head_dim fields.
action_backbone:
  dim: 1024
  ffn_dim: 4096
  # ACTION scheduler α-shift (symmetric to video shift_video); single source of
  # truth for train + deploy. null = template default (5.0).
  shift_action: null
  # COSMOS25 joint_cross_attn only: pin 16×64=1024 (action stream is 1024 wide;
  # auto-resolve's 16×128=2048 wastes attention compute):
  #   +model.action_backbone.num_heads=16 +model.action_backbone.attn_head_dim=64
  # Do NOT add for joint_self_attn — MoT needs per-layer 16×128 parity.

# Dual-System WAM Architecture
# Separate ActionDiT paired with the video DiT. Three variants:
#   - joint_cross_attn: video runs to completion → bridge features captured
#     at configured layers → ActionDiT runs once with cross-attention to those
#     features. The two streams interact only through the bridge.
#   - joint_self_attn:  MoTJointDriver runs a single mixed self-attention at
#     every transformer layer (FastWAM MoT pattern). Q/K/V from each modality
#     are concatenated, attention is computed once, then split back. Requires
#     identical num_layers / num_heads / head_dim across the two backbones.
#   - idm: FastWAM-IDM style teacher-forcing training, then two-stage inference:
#     denoise video first and use frozen video K/V while denoising actions.
#
# Video backbone is configured inline in the `video_backbone:` block at the
# bottom of this file. Default is Wan 2.2 TI2V-5B. To switch, either edit
# `video_backbone.name` / `video_backbone.model_path` here, or override on CLI:
#   bash scripts/train.sh model=dual_system \
#       model.video_backbone.name=wan21_vace_1_3b \
#       model.video_backbone.model_path=/path/to/Wan2.1-VACE-1.3B
# IMPORTANT: `name` is only used for registry dispatch (all wan variants share
# one adapter); the actual backbone loaded is determined entirely by
# `model_path`. CLI overrides must update BOTH fields together — overriding
# only `name` silently loads whatever `model_path` still points at. A
# normalize-and-match cross-check in `build_training_pipeline` logs a WARNING
# on mismatch but does not abort.

architecture:
  # Common dual-system selector and data-shape knobs.
  framework: dual_system
  variant: joint_self_attn   # joint_self_attn or joint_cross_attn or idm
  action_dim: 20

  # Proprioceptive state conditioning.
  # Used by all dual-system variants. When enabled, dataloaders must provide
  # sample["proprio"], and the architecture appends one FastWAM-style proprio
  # token to the raw text context before video/action backbones consume it.
  use_proprioception: true
  state_dim: 20                  # required when use_proprioception=true

  # Common ActionDiT layer selection.
  # joint_cross_attn: chooses which video DiT layers feed bridge cross-attention.
  # joint_self_attn/idm: there is no bridge feature collection, but the resolved
  # layer count is still used to size ActionDiT. It must match the video
  # backbone's num_layers for MoT mixed attention. Usually leave
  # bridge_layers: null + bridge_interval: 1.
  #   (a) Explicit list:  bridge_layers: [0, 1, ..., 29]
  #   (b) Interval mode:  set bridge_layers: null and use bridge_interval.
  #       - interval=1 → all inferred video DiT layers
  #       - interval=2 → every other inferred layer
  bridge_layers: null
  bridge_interval: 1

  # ------------------------------
  # joint_self_attn + idm behavior
  # ------------------------------
  # MoTJointDriver options. Only used when variant is joint_self_attn or idm;
  # ignored by joint_cross_attn.
  mot_checkpoint_mixed_attn: true       # gradient-checkpoint the mixed attention itself; trades VRAM for one extra recompute per layer
  # OpenWAM MoT joint-mask mode. Only user-configurable for variant=joint_self_attn.
  # variant=idm fixes this internally to ``joint``: IDM training uses its own
  # teacher-forcing mask, and IDM inference must keep the matching FastWAM-style
  # video/action joint mask. Do not override this field for idm.
  #
  # Available layouts:
  #   bidirectional: pass attn_mask=None (full v↔a). Useful for ablations.
  #   joint        : [Sv+Sa, Sv+Sa] bool mask with v↔v from
  #                  ``video_attention_mask_mode``, a↔a True, a→v True,
  #                  v→a False (video doesn't see action; required for
  #                  optional video-KV prefill).
  attention_mask_mode: joint
  # Video-to-video self-attention mask used by the video backbone.
  # joint_self_attn: controls the v↔v block inside the joint mask.
  # idm: controls the noisy-video and cond-video v↔v submasks inside the
  #      teacher-forcing training mask, and the frozen-video cache prefill mask
  #      during inference. This mirrors FastWAM's video_expert
  #      build_video_to_video_mask() behavior.
  #   bidirectional       : full v↔v
  #   per_frame_causal    : token-level frame-causal block-diagonal
  #   first_frame_causal  : first-frame tokens only see themselves; rest see all
  # FastWAM-Joint uses ``first_frame_causal`` by default.
  video_attention_mask_mode: first_frame_causal

  # ------------------------------
  # joint_cross_attn-only behavior
  # ------------------------------
  # Only used when variant=joint_cross_attn; ignored under joint_self_attn/idm.
  # IDM does not have a detach_bridge operation: its action path is coupled
  # through MoT teacher-forcing during training and frozen-video KV cache during
  # inference, not through detachable bridge features.
  detach_bridge: false

  # ------------------------------
  # idm-only behavior
  # ------------------------------
  # Only used when variant is idm.
  idm_video_cond_noise_prob: 0.5

# ActionDiT transformer parameters.
# Geometry fields are auto-resolved from the loaded video_backbone by the
# architecture __init__ (see openwam/model/architectures/dual_system/{joint_self_attn,joint_cross_attn,idm}.py):
#   - num_layers   : auto from len(bridge_layers)
#   - video_dim    : auto from video_backbone.dim
#   - num_heads    : auto from video_backbone.num_heads
#                    joint_self_attn / idm hard-require parity (MoT mixed
#                    attention). joint_cross_attn does not require parity but
#                    defaults to vb for apples-to-apples; CLI overrides accepted.
#   - attn_head_dim: auto from video_backbone.head_dim, same parity rule.
# As a result you no longer need to write these in the yaml — switching the
# video_backbone alone reshapes the action head correctly. Override on the CLI
# only for intentional ablations. Because these fields are no longer present in
# the yaml, Hydra struct mode requires `+` (append) instead of plain assign:
#   +model.action_backbone.num_heads=16 +model.action_backbone.attn_head_dim=64
#
# FastWAM-Joint heterogeneous-hidden layout: action residual stream is narrower
# than video (1024 vs 3072 on TI2V-5B) but Q/K/V project to the shared
# ``num_heads * attn_head_dim`` attention space, so the MoT driver
# (joint_self_attn) still runs a single mixed attention. joint_cross_attn
# accepts the same fields so the two variants can be compared apples-to-apples
# — only the inter-modality coupling differs.
#   - dim     : action residual hidden dim
#   - text_dim: raw Wan/FastWAM text/proprio context dim before the action
#               expert's own context embedding
#   - ffn_dim : action expert FFN intermediate dim
# Action expert param count at the default setup: ~1.0B (vs ~5.0B video expert
# on TI2V-5B).
action_backbone:
  dim: 1024
  text_dim: 4096
  ffn_dim: 4096

# Video backbone. Default: Wan 2.2 TI2V-5B.
#
# DiT geometry per backbone (auto-consumed by the architecture; no need to
# mirror in this yaml):
#   - wan22_ti2v_5b     : dim=3072, num_heads=24, head_dim=128, num_layers=30
#   - wan21_vace_1_3b   : dim=1536, num_heads=12, head_dim=128, num_layers=30
#   - wan21_i2v_14b_480p: dim=5120, num_heads=40, head_dim=128, num_layers=40
#
# Resolution: any height/width with height % 32 == 0 and width % 32 == 0 for
# wan22_ti2v_5b; VACE-1.3B only supports 480x832 or 720x1280; I2V-14B-480P
# expects 480x832 first-frame conditioning. Actual training resolution is set
# by the dataloader config.
#
# `from_scratch: true` keeps the Wan DiT structure but discards the loaded DiT
# weights and re-initializes them from PyTorch defaults. VAE and text encoder
# still load pretrained weights and are frozen by the training_strategy yaml.
# Use this for "pretrained DiT vs from-scratch DiT" ablations. Reproducibility
# is governed by `cfg.project.seed` (applied by OpenWAMTrainer before
# architecture construction).
#
# To switch backbones, comment out the default `name` + `model_path` below and
# uncomment ONE alternative pair below. Keep `name` and `model_path` paired —
# overriding only one of them on the CLI silently loads the wrong backbone
# (see "IMPORTANT" note at the top of this file).
# Tested alternatives (uncomment as a pair):
#   # name: wan21_vace_1_3b
#   # model_path: /path/to/Wan2.1-VACE-1.3B
#
#   # name: wan21_i2v_14b_480p
#   # model_path: /path/to/weights/Wan2.1-I2V-14B-480P
video_backbone:
  name: wan22_ti2v_5b
  model_path: /path/to/Wan2.2-TI2V-5B  # [Required] Path to your own directory
  from_scratch: false
  # External encoder swap. Only consumed when from_scratch=true; when
  # from_scratch=false the block is silently ignored (an INFO log is emitted
  # so users debugging can find the answer). Default `wan_vae` reproduces
  # the native pipe.vae path bit-for-bit (the default hooks on VideoEncoder
  # produce Wan-original Conv3d/Linear shapes). To swap in a non-VAE
  # encoder, change `name` to a registered alternative and update
  # `model_path` to its weights directory — see docs/external_video_encoder.md.
  encoder:
    name: wan_vae
    model_path: /path/to/Wan2.2-TI2V-5B

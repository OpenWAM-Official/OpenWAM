# Tri-system architecture: video DiT + shared ActionDiT + Understanding Expert + Qwen3-VL.
# OpenWAM-native trimodal MoT: reuse the dual-system joint_self_attn action
# backbone and add understanding tokens as the third mixed-attention stream.
#
# Video backbone is configured inline in the `video_backbone:` block at the
# bottom of this file. Default is Wan 2.2 TI2V-5B. To switch, either edit
# `video_backbone.name` / `video_backbone.model_path` here, or override on CLI:
#   bash scripts/train.sh model=tri_system \
#       model.video_backbone.name=<name> model.video_backbone.model_path=<path>
# IMPORTANT: `name` is only used for registry dispatch (all wan variants share
# one adapter); the actual backbone loaded is determined entirely by
# `model_path`. CLI overrides must update BOTH fields together — overriding
# only `name` silently loads whatever `model_path` still points at. A
# normalize-and-match cross-check in `build_training_pipeline` logs a WARNING
# on mismatch but does not abort.
# Note: tri_system currently only exercises wan22_ti2v_5b end-to-end; pairing
# it with VACE / I2V composes at the config layer but raises
# NotImplementedError in the tri_system adapter at build time — no VACE / I2V
# plumbing exists for the trimodal branch yet. The alternative blocks at the
# bottom are kept for parity with dual_system / shared_backbone only.

# Note: vlm_backbone / understanding_expert MUST live under the architecture: block
# for resolve_architecture_config to forward them to build-time cfg.
# (action_backbone fields are flattened to the top level instead.)
architecture:
  framework: tri_system
  variant: joint_self_attn
  # action_dim / state_dim default to 20 to match the default dataloader
  # (configs/dataloader/robotwin.yaml: action_mode=eef → 20D xyz+rot6d+grip).
  # If you switch the dataloader to action_mode=joint (14D qpos), override
  # these to 14 on the CLI, e.g.
  #   bash scripts/train.sh model=tri_system \
  #       dataloader.action_mode=joint \
  #       model.architecture.action_dim=14 \
  #       model.architecture.state_dim=14
  action_dim: 20
  use_proprioception: true
  state_dim: 20

  # Tri-system MoT joint-mask mode.
  #
  #   bidirectional : no explicit mask; fully connected [V+A+U] attention.
  #   joint         : [Sv+Sa+Su, Sv+Sa+Su] bool mask with:
  #                   - v->v from ``video_attention_mask_mode``
  #                   - v->a disabled
  #                   - v->u enabled
  #                   - action query rows fully connected
  #                   - understanding query rows see understanding only
  attention_mask_mode: joint

  # Controls the v->v block when attention_mask_mode=joint:
  #   bidirectional      : all video tokens see all video tokens
  #   per_frame_causal   : frame i sees frames <= i
  #   first_frame_causal : first-frame tokens only see first-frame tokens;
  #                        all later video tokens see all video tokens
  video_attention_mask_mode: first_frame_causal

  # Wrap the inner mixed self-attention call in torch.utils.checkpoint to trade compute
  # for activation memory. Default True; set False only if you're memory-rich and want
  # a small speed-up. The trimodal [V+A+U] attention sequence can be ≥ several thousand
  # tokens at full resolution, so disabling this typically OOMs Wan22 + Qwen3-VL training.
  mot_checkpoint_mixed_attn: true

  # Bridge layers — which video DiT layers participate in trimodal joint attention.
  # For the ``joint_self_attn`` variant the MoT driver enforces a 1:1 mapping with the
  # video backbone's layer count, so the bridge_layers tuple must be exactly
  # ``range(0, vb.num_layers)`` — i.e. ``bridge_interval=1``. The fields below are
  # exposed for parity with dual_system; setting them to a sparse pattern will be
  # caught by ``TriSystemMoTDriver.__init__`` with a clear error.
  bridge_layers: null
  bridge_interval: 1

  vlm_backbone:
    checkpoint_path: /path/to/Qwen3-VL-2B-Instruct  # [Required] Path to your own directory
    # load_pretrained: true loads HF weights from checkpoint_path. Set false for
    # random-init ablations or CPU smoke tests (e.g. tests/test_tri_system_smoke.py).
    # The VLM is frozen during joint training (see configs/training_strategy/joint.yaml).
    load_pretrained: true
    # Maximum text token length for the VLM processor. Inputs longer than this
    # are silently truncated. Increase for multi-image or long-prompt scenarios.
    max_length: 512

  # Motus-style understanding expert. The VLM hidden state is first projected
  # into ``dim`` via ``vlm_projector_type``, then participates in trimodal joint
  # attention at every video DiT layer (num_layers is auto-set to vb.num_layers).
  understanding_expert:
    dim: 512                        # Understanding stream hidden dim (Motus default)
    ffn_dim: 2048                   # FFN intermediate dim
    vlm_projector_type: mlp3x_silu  # linear | mlp{N}x_silu — N-layer SiLU MLP from VLM hidden_size to dim
    eps: 1.0e-5                     # RMSNorm epsilon inside understanding blocks

# ActionDiT transformer parameters. Tri-system only supports joint_self_attn,
# which runs a single mixed attention across [video, action, understanding].
# Geometry fields are auto-resolved from the loaded video_backbone by the
# architecture __init__ (see TriSystemJointSelfAttnArchitecture in
# openwam/model/architectures/tri_system/joint_self_attn.py):
#   - num_layers   : auto from len(bridge_layers) (== vb.num_layers under interval=1)
#   - video_dim    : auto from video_backbone.dim
#   - num_heads    : auto from video_backbone.num_heads (hard parity)
#   - attn_head_dim: auto from video_backbone.head_dim  (hard parity)
# As a result you no longer need to write these in the yaml — switching the
# video_backbone alone reshapes the action head correctly.
#
# `dim / ffn_dim / text_dim` are free: action residual stream is narrower than
# video (1024 vs 3072 on TI2V-5B) but Q/K/V project up to the shared
# ``num_heads * attn_head_dim`` attention space.
action_backbone:
  dim: 1024
  text_dim: 4096
  ffn_dim: 4096
  # Action-scheduler α-shift (symmetric to video_backbone.shift_video); single
  # source of truth for train + deploy. null = scheduler template default (5.0).
  shift_action: null

# Video backbone. Default: Wan 2.2 TI2V-5B (the only backbone with end-to-end
# tri_system plumbing today; VACE/I2V composition raises NotImplementedError
# in the adapter — see the top-of-file note).
#
# DiT geometry per backbone (auto-consumed by the architecture):
#   - wan22_ti2v_5b     : dim=3072, num_heads=24, head_dim=128, num_layers=30
#   - wan21_vace_1_3b   : dim=1536, num_heads=12, head_dim=128, num_layers=30
#   - wan21_i2v_14b_480p: dim=5120, num_heads=40, head_dim=128, num_layers=40
#
# `from_scratch: true` keeps the Wan DiT structure but re-initializes the DiT
# weights from PyTorch defaults; VAE/text encoder still load pretrained
# weights. Reproducibility is governed by `cfg.project.seed`.
#
# Tested alternatives (parity placeholders; DO NOT enable on tri_system —
# the adapter raises NotImplementedError at build time, see top-of-file note):
#   # ⚠️ tri_system adapter: NotImplementedError at build time
#   # name: wan21_vace_1_3b
#   # model_path: /path/to/Wan2.1-VACE-1.3B
#
#   # ⚠️ tri_system adapter: NotImplementedError at build time
#   # name: wan21_i2v_14b_480p
#   # model_path: /path/to/weights/Wan2.1-I2V-14B-480P
video_backbone:
  name: wan22_ti2v_5b
  model_path: /path/to/Wan2.2-TI2V-5B  # [Required] Path to your own directory
  from_scratch: false
  # MUST match encoder.spec.temporal_compression / causal_temporal.
  # Wan VAE       = (4, True)   ← default
  # V-JEPA 2.1    = (2, True)   ← causal emulation via image-branch first-frame
  # DINOv3        = (1, False)  ← per-frame, no tubelet
  # Together with dataset.num_frames / video_stride must satisfy:
  #   if causal_temporal:  (num_video_frames - 1) % temporal_compression == 0
  #   else:                 num_video_frames      % temporal_compression == 0
  # base.py asserts these against the constructed encoder; mismatch = fail-fast.
  temporal_compression: 4
  causal_temporal: true
  shift_video: null
  # External encoder swap. Only consumed when from_scratch=true; when
  # from_scratch=false the block is silently ignored (an INFO log is emitted
  # so users debugging can find the answer). Default `wan_vae` reproduces
  # the native pipe.vae path bit-for-bit. See docs/external_video_encoder.md
  # for non-VAE encoders.
  encoder:
    name: wan_vae
    model_path: /path/to/Wan2.2-TI2V-5B

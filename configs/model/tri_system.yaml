# Tri-system: video DiT + ActionDiT + Understanding Expert (Qwen3-VL). Reuses
# the dual-system joint_self_attn action backbone + understanding tokens as a
# third mixed-attention stream. Only joint_self_attn is supported.
# Video backbone from the Hydra `video_backbone` group (default Wan22 TI2V-5B).

defaults:
  - video_backbone: wan22   # default Wan22 TI2V-5B; CLI: model/video_backbone=wan21
  - _self_

# Frozen pretrained components (freeze_modules walks each via get_submodule;
# missing paths silently skipped — image_encoder None on TI2V/VACE, _encoder
# only on the from_scratch external-encoder path).
freeze:
  - video_backbone.text_encoder
  - video_backbone.vae
  - video_backbone.image_encoder
  - video_backbone.video_encoder
  - vlm_backbone.vlm_model

# vlm_backbone / understanding_expert MUST stay under `architecture:` for
# resolve_architecture_config to forward them (action_backbone is flattened to top level).
architecture:
  framework: tri_system
  variant: joint_self_attn
  # action_dim/state_dim default 20 (robotwin action_mode=eef). For action_mode=joint
  # (14D qpos) override both to 14 on CLI.
  action_dim: 20
  use_proprioception: true
  state_dim: 20
  # Raw text/context dim shared by the video + action streams. Auto-resolves
  # from video_backbone.text_dim; 4096 = Wan T5-XXL.
  text_dim: 4096

  # joint mask: v→v from video_attention_mask_mode; v→a off, v→u on; action rows
  # fully connected; understanding rows see understanding only.
  attention_mask_mode: joint   # joint | bidirectional
  video_attention_mask_mode: first_frame_causal   # first_frame_causal | per_frame_causal | bidirectional

  # grad-checkpoint the mixed attention. The [V+A+U] sequence can be thousands of
  # tokens — disabling typically OOMs Wan22 + Qwen3-VL.
  mot_checkpoint_mixed_attn: true

  # joint_self_attn enforces 1:1 with vb.num_layers, so keep bridge_interval=1
  # (sparse patterns raise in TriSystemMoTDriver.__init__).
  bridge_layers: null
  bridge_interval: 1

  vlm_backbone:
    checkpoint_path: /path/to/Qwen3-VL-2B-Instruct  # [Required]
    load_pretrained: true   # false = random-init (ablations / CPU smoke tests). Frozen in joint training.
    max_length: 512         # VLM processor max text length; longer inputs truncated.

  # Understanding expert: VLM hidden → `dim` via vlm_projector_type, then joins
  # trimodal attention at every video layer (num_layers auto = vb.num_layers).
  understanding_expert:
    dim: 512                        # understanding stream hidden dim (Motus default)
    ffn_dim: 2048
    vlm_projector_type: mlp3x_silu  # linear | mlp{N}x_silu (N-layer SiLU MLP)
    eps: 1.0e-5

# ActionDiT. Geometry auto-resolved from video_backbone (num_layers/video_dim/
# num_heads/attn_head_dim, hard head parity). dim/ffn_dim are free; raw context
# width comes from architecture.text_dim above (shared with the video stream).
action_backbone:
  dim: 1024
  ffn_dim: 4096
  # ACTION scheduler α-shift (symmetric to video shift_video); single source of
  # truth for train + deploy. null = template default (5.0).
  shift_action: null

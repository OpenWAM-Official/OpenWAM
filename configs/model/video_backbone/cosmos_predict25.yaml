# Cosmos-Predict2.5 2B video backbone (dual-system). Fields land in
# cfg.model.video_backbone.* (group path matches the package). Switch backbone
# on CLI: model/video_backbone=cosmos_predict25.
# DiT geometry auto-derived (context_dim=1024). Variants: joint_cross_attn /
# joint_self_attn; idm is NOT supported (adapter raises NotImplementedError).
#
# Freeze policy lives in the model freeze list (the train launcher pins
# video_backbone.vae + video_backbone.reason1; the DiT `dit` is
# TRAINABLE by default). Don't add a `freeze:` knob here — add `video_backbone.dit`
# to the freeze list in an override instead.
#
# REQUIRED override when switching to Cosmos-Predict2.5 (context_dim=1024, not Wan's 4096):
#   model.action_backbone.text_dim=1024     # else the action context-embed shape-crashes
# joint_cross_attn ALSO needs (action stream is only 1024 wide):
#   +model.action_backbone.num_heads=16 +model.action_backbone.attn_head_dim=64
# Do NOT add those for joint_self_attn — MoT needs per-layer 16×128 parity.

name: cosmos_predict25_2b
# Bundle root; build_cosmos_predict25_pipeline globs <model_variant>/<uuid>_ema_bf16.pt.
model_path: /path/to/assets/Cosmos-Predict2.5-2B
model_variant: base/post-trained   # base/{pre,post}-trained | base/distilled | auto/multiview | robot/multiview-agibot | robot/action-cond

# text_encoder (default: none) selects the text pathway:
#   none         = caller supplies a pre_encoded_text cache as the DiT context
#                  (needs dataloader.text_embedding_cache_dir reachable).
#   reason1_live = run Cosmos-Reason1-7B inline.
# The key is omitted here (defaults to none); switch to live on the CLI with the
# `+` append form:
#   +model.video_backbone.text_encoder=reason1_live \
#   +model.video_backbone.text_encoder_path=/path/to/assets/Cosmos-Reason1-7B
# cache wins over live per-sample; preprocess_input raises if neither is available.
# text_encoder_path also lets checkpoints save Reason1 into safetensors + copy
# structural files under <ckpt_dir>/reason1/.

# CFG dropout for the live-encoder path: substitutes "" for prompts with prob p,
# only when training=True. Independent of dataloader.text_embedding_dropout
# (offline-cache path); the two are mutually exclusive (cache > live).
# text_encoder_dropout_seed defaults to null (nondeterministic); set an int for
# reproducibility via +model.video_backbone.text_encoder_dropout_seed=<int>.
text_encoder_dropout: 0.0

vae: wan2pt1                                        # wan2pt1 (Cosmos-Predict2.5 tokenizer; stride 4×8×8, z_dim=16) | none (caller supplies latents)

# Matches upstream rectified-flow shift=5; training target/noising identical to Wan.
# Named shift_video to match the Wan backbone's video-scheduler shift knob.
shift_video: 5.0

# sac_mode (default: none) = Cosmos SAC selective activation checkpointing,
# applied to the DiT blocks after weight load. Trades compute for VRAM. The key
# is omitted here (defaults to none); set via the `+` append form, e.g.
# +model.video_backbone.sac_mode=mm_only:
#   none       = raw, keep all activations (fastest, most VRAM)
#   mm_only    = recompute non-matmul/attn ops at backward, keep the expensive
#                matmul/attention outputs (memory/compute sweet spot)
#   block_wise = recompute the whole block (max VRAM savings, most recompute)

# V-JEPA 2 ViT-g/384 external video encoder (arXiv:2506.09985). Activate via CLI:
#   model.video_backbone.from_scratch=true model.video_backbone.shift_video=12.0 model/video_backbone/encoder=vjepa2
# Spec temporal contract is (4, true), same as the native Wan VAE.
# Structural fields (z_dim=1408/spatial_compression=16/...) read from the weights'
# manifest.json, NOT yaml.
# Difference vs vjepa2_1: the V-JEPA 2 ViT has NO image branch, so there is no
# `vjepa2_1_forward` knob — setting it here fail-fasts at construction.
# from_scratch=true is REQUIRED: Wan DiT first conv expects native VAE z_dim=48, V-JEPA emits 1408.

name: vjepa2
# [Required] Dir with manifest.json + the checkpoint_file it names (e.g. vjepa2_vitg_384.pt;
# arch=vit_giant_xformers_rope, patch=16, tubelet=2, img=384). Weights:
# https://dl.fbaipublicfiles.com/vjepa2/vitg-384.pt (rename to match checkpoint_file).
model_path: /path/to/weights/vjepa2

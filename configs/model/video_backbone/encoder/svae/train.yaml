# @package _global_
# Standalone S-VAE trainer; consumes feature shards from collect_svae_features.py
# (does NOT inherit train.yaml). Entry: scripts/svae_train/train_svae.py.
# input_dim is not set here — the trainer reads it from the collected stats.

svae:
  latent_dim: 48          # compact latent channels; 48 = Wan VAE z_dim for downstream parity
  num_heads: 16           # must divide input_dim
  num_layers: 3           # pre-LN Transformer blocks per side (encoder / decoder)
  intermediate_size: 2048 # FFN hidden width per block
  dropout: 0.0

train:
  features_dir: ??? # REQUIRED — dir from collect_svae_features.py (features_*.pt + stats.pt)
  output_dir: outputs/openwam_svae

  batch_size: 8     # clips per step
  num_epochs: 50
  max_steps: null   # optional hard cap; null = full num_epochs
  num_workers: 4

  lr: 1.0e-4        # AdamW peak LR
  betas: [0.9, 0.99]
  weight_decay: 1.0e-4
  grad_clip: 1.0
  warmup_epochs: 1  # linear warmup (from lr*1e-3), then cosine decay to lr*min_lr_ratio
  min_lr_ratio: 0.9

  # KL: beta * KL(q(z|x) || N(0,I)); beta warmed up over kl_warmup_ratio, kept
  # tiny so reconstruction dominates.
  beta: 1.0e-4
  kl_warmup_ratio: 0.2
  free_bits_per_dim: 0.0 # >0 = posterior-collapse rescue (off by default)
  cos_weight: 1.0        # weight on the (1 - cosine) recon term, added to MSE

  seed: 42
  mixed_precision: bf16  # bf16 | fp16 | no (weights stay fp32)
  log_every: 20

  # wandb (rank-0); project: null disables logging.
  wandb:
    project: openwam-svae
    run_name: null
    entity: null

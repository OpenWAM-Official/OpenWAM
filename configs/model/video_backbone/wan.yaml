# Wan 2.x video backbone (cfg.model.video_backbone.*). Switch backbone: model/video_backbone=cosmos25.

defaults:
  - encoder: wan_vae   # external encoder subgroup; CLI: model/video_backbone/encoder=dinov3
  - _self_

# --- Backbone selection ---
# `name` selects the registry adapter; weights come from `model_path` — override BOTH (name-only is ignored).
name: wan22_ti2v_5b   # wan22_ti2v_5b (any H,W%32==0) | wan21_vace_1_3b (480x832 or 720x1280) | wan21_i2v_14b_480p (480x832, first-frame)
model_path: /path/to/Wan2.2-TI2V-5B  # [Required] weights dir; must match `name`

from_scratch: false   # false = load pretrained DiT | true = re-init DiT from scratch (VAE/text-encoder still load + freeze)

# --- Scheduler ---
shift_video: 5.0       # Flow-matching α-shift (VIDEO scheduler); single source of truth for train + inference

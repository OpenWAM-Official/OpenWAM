# @package model.video_backbone
# Wan 2.2 TI2V-5B video DiT.
# DiT geometry: dim=3072, num_heads=24, head_dim=128, num_layers=30.
# Resolution: any height/width where height % 32 == 0 and width % 32 == 0.
# Actual training resolution is determined by the dataloader config.
#
# `from_scratch: true` keeps the Wan DiT *structure* but discards the loaded
# DiT weights and re-initializes them from PyTorch defaults. VAE and the
# text encoder still load their pretrained weights and are frozen by the
# training_strategy yaml. Use this for "pretrained DiT vs from-scratch DiT"
# ablations. Reproducibility is governed by `cfg.project.seed` (applied by
# OpenWAMTrainer before architecture construction).
name: wan22_ti2v_5b
model_path: /path/to/Wan2.2-TI2V-5B  # [Required] Path to your own directory
from_scratch: false

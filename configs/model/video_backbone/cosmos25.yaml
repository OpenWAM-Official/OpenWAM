# Cosmos-Predict2.5 2B video backbone (dual-system). Fields land in
# cfg.model.video_backbone.* (group path matches the package). Switch backbone
# on CLI: model/video_backbone=cosmos25.
# DiT geometry auto-derived (context_dim=1024). Variants: joint_cross_attn /
# joint_self_attn; idm is NOT supported (adapter raises NotImplementedError).
#
# Freeze policy lives in the model freeze list (the train launcher pins
# video_backbone._vae_inner + video_backbone._reason1_inner; the DiT `dit` is
# TRAINABLE by default). Don't add a `freeze:` knob here — add `video_backbone.dit`
# to the freeze list in an override instead.
#
# REQUIRED override when switching to Cosmos25 (context_dim=1024, not Wan's 4096):
#   model.action_backbone.text_dim=1024     # else the action context-embed shape-crashes
# joint_cross_attn ALSO needs (action stream is only 1024 wide):
#   +model.action_backbone.num_heads=16 +model.action_backbone.attn_head_dim=64
# Do NOT add those for joint_self_attn — MoT needs per-layer 16×128 parity.

name: cosmos25_predict_2b
# Bundle root; build_cosmos25_pipeline globs <model_variant>/<uuid>_ema_bf16.pt.
model_path: /path/to/assets/Cosmos-Predict2.5-2B
model_variant: base/post-trained   # base/{pre,post}-trained | base/distilled | auto/multiview | robot/multiview-agibot | robot/action-cond

# text_encoder: none = caller supplies pre_encoded_text cache; reason1_live = inline
# Cosmos-Reason1-7B. At least one of (live encoder, dataloader.text_embedding_cache_dir)
# must be reachable or preprocess_input raises; cache wins over live per-sample.
# text_encoder_path → Cosmos-Reason1-7B (both modes) so checkpoints can save Reason1
# into safetensors + copy structural files under <ckpt_dir>/reason1/.
text_encoder: none
text_encoder_path: null                             # e.g. /path/to/assets/Cosmos-Reason1-7B

# CFG dropout for the live-encoder path: substitutes "" for prompts with prob p,
# only when training=True. Independent of dataloader.text_embedding_dropout
# (offline-cache path); the two are mutually exclusive (cache > live).
text_encoder_dropout: 0.0
text_encoder_dropout_seed: null                     # int for reproducibility; null = nondeterministic.

vae: wan2pt1                                        # wan2pt1 (Cosmos-Predict2.5 tokenizer; stride 4×8×8, z_dim=16) | none (caller supplies latents)

# Matches upstream rectified-flow shift=5; training target/noising identical to Wan.
flow_shift: 5.0

# SAC selective-checkpoint, applied after weight load. none = raw;
# mm_only = recompute non-matmul/attn at backward; block_wise = recompute all.
sac_mode: none

# Cosmos-Predict2.5-2B video backbone (cfg.model.video_backbone.*). DiT geometry
# and the action-side context width (text_dim=1024) auto-derive. Works with
# dual_system (joint_cross_attn | joint_self_attn | idm), single_system
# (vanilla | moe) and tri_system. Freeze policy lives in the model-level freeze
# list (vae + reason1 pinned there; the DiT is trainable by default).
# joint_cross_attn only: also pass
#   +model.action_backbone.num_heads=16 +model.action_backbone.attn_head_dim=64
# (do NOT add these for joint_self_attn — MoT needs per-layer 16x128 parity).

name: cosmos_predict25_2b
model_path: /path/to/Cosmos-Predict2.5-2B  # [Required] bundle root; <model_variant>/<uuid>_ema_bf16.pt is globbed inside
model_variant: base/post-trained   # base/{pre,post}-trained | base/distilled | auto/multiview | robot/multiview-agibot | robot/action-cond

# Cosmos-Reason1-7B bundle root, run inline as the live text encoder (training
# only; checkpoints embed it, so deploy needs no external path).
text_encoder_path: /path/to/Cosmos-Reason1-7B

text_encoder_dropout: 0.0  # CFG dropout: prob of substituting "" for prompts (training only); seed via +model.video_backbone.text_encoder_dropout_seed=<int>

vae: wan2pt1       # wan2pt1 (Cosmos-Predict2.5 tokenizer; stride 4x8x8, z_dim=16) | none (caller supplies latents)

shift_video: 5.0   # flow-matching α-shift for the video scheduler (train + deploy single source of truth)

# Optional (append via +model.video_backbone.sac_mode=...): Cosmos selective
# activation checkpointing on the DiT blocks, trades compute for VRAM —
# none (default) | mm_only | block_wise.

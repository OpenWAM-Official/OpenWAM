# Shared Backbone — Wan2.1-VACE-1.3B video backbone variant.
# Action tokens are concatenated into the shared DiT sequence. VACE-1.3B
# does not natively produce per-token t_mod; the shared_backbone forward
# requests force_per_token_t_mod=True so wan_adapter.prepare broadcasts
# the global timestep across every video token (see plan §7.1).

architecture:
  framework: shared_backbone
  variant: vanilla   # vanilla | moe (override on CLI for smoke)
  action_dim: 20
  use_proprioception: true
  state_dim: 20

  attention_mask_mode: joint
  video_attention_mask_mode: first_frame_causal

  action_decoder_hidden_dim: 1024

  # moe-only fields below; ignored under variant=vanilla.
  expert_ffn_dim: 4096
  expert_layers: null
  expert_interval: 1

# Video backbone — VACE only supports 480x832 or 720x1280.
# Actual training resolution is determined by dataloader config.
video_backbone:
  name: wan21_vace_1_3b
  model_path: /path/to/Wan2.1-VACE-1.3B  # [Required] Path to your own directory

# Dual-System WAM — Wan2.1-I2V-14B-480P video backbone variant.
# Separate ActionDiT paired with the I2V-14B-480P video DiT.
# Only joint_cross_attn is wired here: joint_self_attn × ZeRO-3 is blocked
# upstream by the MoT driver's direct-param reads (see plan §7.3).

architecture:
  framework: dual_system
  variant: joint_cross_attn
  detach_bridge: false
  action_dim: 20
  use_proprioception: true
  state_dim: 20

  # Auto-fill bridge_layers from the video backbone's num_layers (=40 for I2V-14B-480P).
  bridge_layers: null
  bridge_interval: 1

  attention_mask_mode: joint
  video_attention_mask_mode: first_frame_causal

# Video backbone — I2V-14B-480P expects 480x832 first-frame conditioning.
# Actual training resolution is determined by dataloader config.
video_backbone:
  name: wan21_i2v_14b_480p
  model_path: /path/to/weights/Wan2.1-I2V-14B-480P  # [Required] Path to your own directory

# ActionDiT transformer parameters.
# I2V-14B-480P video DiT: dim=5120, num_heads=40, head_dim=128 (plan §3.4).
# joint_cross_attn does not require parity, but mirroring keeps the
# attention space aligned at num_heads*attn_head_dim = 5120 if a future
# user flips variant to joint_self_attn under ZeRO-2.
action_backbone:
  dim: 1024
  text_dim: 4096
  ffn_dim: 4096
  num_heads: 40
  attn_head_dim: 128

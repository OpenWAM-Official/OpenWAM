# @package model.video_backbone.encoder
#
# Hydra group config for the V-JEPA 2.1 ViT-g/384 external video encoder
# (Mur-Labadia et al., arXiv:2603.14482). Activated by overriding the
# inline ``encoder:`` block in ``configs/model/backbone/wan.yaml`` on
# the CLI:
#
#   bash scripts/train.sh \
#     model=dual_system \
#     'model.video_backbone.from_scratch=true' \
#     'model.video_backbone.shift_video=12.0' \
#     'model/encoder=vjepa2_1'
#
# ``temporal_compression`` / ``causal_temporal`` no longer need a CLI
# override — the encoder spec exposes ``(4, true)`` which already matches
# the wan.yaml default (Wan2.2-TI2V-5B native VAE has the same shape).
# The cross-check in ``BaseWAMArchitecture._init_video_backbone`` passes
# without intervention.
#
# This yaml is the canonical reference for the encoder block fields and
# the notes that go with them. Structural fields (z_dim / spatial_compression /
# etc.) come from the loaded weights' ``manifest.json`` — NOT from yaml.
#
#
# Token-count parity with Wan VAE on RoBoTwin (num_frames=33, video_stride=4,
# H=384, W=320, Wan2.2-TI2V-5B VAE upsample=16):
#   wan.vae:       3 latent frames × (384/16/2)×(320/16/2) = 3 × 12 × 10 = 360
#   vjepa2_1:      3 latent frames × (384/16/2)×(320/16/2) = 3 × 12 × 10 = 360
#   (1 cond + 2 mean-pooled target latents, encoder-side avg-pool stride=2)
#
# Why ``from_scratch=true`` is required: the pre-trained Wan TI2V DiT's
# first conv channels are bound to native Wan VAE z_dim=48, but V-JEPA
# emits z_dim=1408. ``reinit_dit_from_scratch`` rebuilds patch_embedding
# and head.head against the new spec.

name: vjepa2_1
# [Required] Directory holding ``manifest.json`` + the ``checkpoint_file``
# the manifest names (e.g. ``vjepa2_1_vitg_384.pt``). The current production
# manifest pins arch_name=vit_giant_xformers_rope, patch=16, tubelet=2,
# img_size=384, training_num_frames=64.
model_path: /path/to/weights/vjepa2_1

# How to obtain the condition (frame-0) latent in ``batch_encode``:
#   - ``video`` (default): dup frame 0 once and route the resulting
#     2-frame clip through the V-JEPA 2.1 video branch (tubelet=2).
#     The target pass independently prepends a frame-0 pair to the
#     N target frames and discards its own first temporal slice, so
#     condition and target each go through their own forward — no
#     leakage in either direction.
#   - ``mixed``: legacy path. Frame 0 goes through the V-JEPA 2.1 image
#     branch (tubelet=1, single forward); the target pass is unchanged.
# Target latents always come from the prepend-and-drop video forward
# regardless of this setting — this knob ONLY controls the cond pass.
vjepa2_1_forward: video

# @package model.video_backbone.encoder
#
# Hydra group config for the FLUX.2-dev image VAE external video encoder
# (Black Forest Labs FLUX.2-dev, diffusers ``AutoencoderKLFlux2`` checkpoint).
# Activated by overriding the inline ``encoder:`` block in
# ``configs/model/backbone/wan.yaml`` on the CLI:
#
#   bash scripts/train.sh \
#     model=dual_system \
#     'model.video_backbone.from_scratch=true' \
#     'model/encoder=flux_vae'
#
# ``temporal_compression`` / ``causal_temporal`` need no CLI override — the
# encoder spec exposes ``(4, true)`` which already matches the wan.yaml default
# (Wan2.2-TI2V-5B native VAE has the same temporal shape). The cross-check in
# ``BaseWAMArchitecture._init_video_backbone`` passes without intervention.
#
# Structural fields (z_dim / spatial_compression / num_res_blocks) come from the
# diffusers ``config.json`` at ``model_path`` — NOT from yaml. The FLUX.2 VAE is a
# 2D image VAE applied per-frame; the wrapper does a parameter-free causal mean
# pool over time to recover Wan VAE's ``T_lat = 1 + (T-1)/4`` semantics. The VAE's
# built-in non-affine BatchNorm whitening (the analogue of Wan VAE's per-channel
# z-score) is kept, so — unlike DINOv3 — no extra LayerNorm is added.
#
# Spec (derived from the FLUX.2-dev config.json):
#   z_dim                = 128   (latent_channels 32 × 2×2 pixel-shuffle pack)
#   spatial_compression  = 16    (8× conv downsample × 2× pixel-shuffle;
#                                 identical to Wan2.2-TI2V-5B VAE)
#   temporal_compression = 4     (external causal mean pool; per-frame VAE has
#                                 no temporal axis of its own)
#   causal_temporal      = true  (frame 0 kept as-is, rest pooled in 4s)
#   dit_patch_size       = (1, 2, 2)   (Wan VAE parity)
#   is_reversible        = false (only the encoder half of the VAE is loaded)
#
# Token-count parity with Wan VAE on RoboTwin (num_frames=33, video_stride=4,
# H=384, W=320, both spatial_compression=16, dit_patch_size=(1,2,2)):
#   wan.vae:   3 latent frames × (384/16/2)×(320/16/2) = 3 × 12 × 10 = 360
#   flux_vae:  3 latent frames × (384/16/2)×(320/16/2) = 3 × 12 × 10 = 360
#   (1 frame-0 cond + 2 mean-pooled target latents from causal pool)
#
# Why ``from_scratch=true`` is required: the pre-trained Wan TI2V DiT's first
# conv channels are bound to native Wan VAE z_dim=48, but FLUX.2 emits z_dim=128.
# ``reinit_dit_from_scratch`` rebuilds patch_embedding and head.head against the
# new spec via the default VideoEncoder hooks.

name: flux_vae
# [Required] Directory holding the diffusers ``AutoencoderKLFlux2`` snapshot —
# must contain ``config.json`` and the ``diffusion_pytorch_model.safetensors``
# weights. The deploy host must be able to read this directory too (FLUX.2 VAE
# re-reads config.json at deploy via ``from_skeleton``, like DINOv3).
model_path: /path/to/FLUX.2-dev_VAE

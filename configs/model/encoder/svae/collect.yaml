# @package _global_
#
# S-VAE offline feature-collection entry config.
#
# Inherits the FULL production chain from configs/train.yaml (model + dataloader
# + accelerate + the entire ``training`` block) via the ``/train`` default, then
# overrides only the training_strategy (collection has no action stream). The
# collector reads ``training.batch_size`` / ``training.dataset_num_workers``,
# the ``model.video_backbone.encoder`` / ``dataloader`` chains and ``project.seed``
# straight from that inherited config, so the traversal, batch size, transforms
# and worker seeding stay bit-identical to real training — editing train.yaml /
# the dataloader group once propagates here, no parallel block to keep in sync.
#
# The collector iterates the FULL dataset exactly once (one epoch), so there is
# no sampling knob — the only collection-specific field is the output root.
#
# Entry point: scripts/collect_svae_features.py
# (wrapped by scripts/collect_svae_features.sh under torchrun).

defaults:
  - /train
  - override /training_strategy: video_only # collection has no action stream
  - _self_

svae_collect:
  # Output root. The script creates ``<encoder_name>_<timestamp>/`` and writes
  # chunked ``features_rank{r}_part{p}.pt`` shards + a global ``stats.pt``
  # (per-channel mean/std for the S-VAE input standardisation) + a config
  # snapshot. Point ``scripts/train_svae.py``'s ``train.features_dir`` at it.
  output_dir: /path/to/workspace/openwam/svae

# @package model.video_backbone.encoder
#
# Hydra group config for the V-JEPA 2 ViT-g/384 external video encoder
# (Assran et al., arXiv:2506.09985). Activated by overriding the inline
# ``encoder:`` block in ``configs/model/backbone/wan.yaml`` on the CLI:
#
#   bash scripts/train.sh \
#     model=dual_system \
#     'model.video_backbone.from_scratch=true' \
#     'model.video_backbone.shift_video=12.0' \
#     'model/encoder=vjepa2'
#
# ``temporal_compression`` / ``causal_temporal`` no longer need a CLI
# override — the encoder spec exposes ``(4, true)`` which already matches
# the wan.yaml default. The cross-check in
# ``BaseWAMArchitecture._init_video_backbone`` passes without intervention.
#
# This yaml is the canonical reference for the encoder block fields and
# the notes that go with them. Structural fields (z_dim / spatial_compression /
# etc.) come from the loaded weights' ``manifest.json`` — NOT from yaml.
#
# Spec (derived from the manifest):
#   z_dim                            = 1408 (ViT-g embed_dim)
#   spatial_compression              = 16   (ViT-g/16 patch_embed)
#   temporal_compression             = 4    (ViT tubelet=2 + extra time-pool
#                                            stride=2; matches Wan VAE
#                                            causal grouping 1 + 4 + 4 + ...)
#   causal_temporal                  = true (cond pass is independent of targets)
#   dit_patch_size                   = (1, 2, 2)   (Wan VAE parity)
#   is_reversible                    = false (no pixel decoder)
#
# See vjepa2_1.yaml for the token-count parity worked example; the math
# is identical (same patch_embed + DiT patch_size + temporal pipeline).
#
# Difference vs the vjepa2_1 encoder: the upstream V-JEPA 2 ViT (from
# ``src.models.vision_transformer``) has no image branch — the
# ``img_temporal_dim_size`` fast path is a V-JEPA 2.1 addition. So the
# cond pass here is always the dup+video forward (cat([f0, f0]) →
# tubelet=2), and there is no ``vjepa2_1_forward`` knob. Setting that
# field on the vjepa2 encoder is a fail-fast at construction time —
# the field has no meaning here.
#
# Why ``from_scratch=true`` is required: see vjepa2_1.yaml — same
# reasoning (Wan DiT first conv expects native VAE z_dim=48; V-JEPA
# emits z_dim=1408).

name: vjepa2
# [Required] Directory holding ``manifest.json`` + the ``checkpoint_file``
# the manifest names (e.g. ``vjepa2_vitg_384.pt``). The production manifest
# pins arch_name=vit_giant_xformers_rope, patch=16, tubelet=2,
# img_size=384, training_num_frames=64. Download the upstream weights
# from https://dl.fbaipublicfiles.com/vjepa2/vitg-384.pt and drop them
# at this path, renamed to match the manifest's ``checkpoint_file``.
model_path: /path/to/weights/vjepa2

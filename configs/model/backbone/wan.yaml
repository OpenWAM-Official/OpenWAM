# @package model.video_backbone
# Wan 2.x video backbones for the dual-system framework.
#
# Composed into framework yamls (e.g. dual_system.yaml) via the Hydra
# `backbone` group; the `@package` directive above flattens these fields
# into `cfg.model.video_backbone.*` (matching the consumer in
# openwam/model/registry.py:resolve_architecture_config).
#   defaults:
#     - backbone: wan
# Switch to a different backbone group on CLI:
#   bash scripts/train.sh model=dual_system model/backbone=cosmos25
#
# DiT geometry per variant (auto-consumed by the architecture; no need to
# mirror in the framework yaml):
#   - wan22_ti2v_5b      : dim=3072, num_heads=24, head_dim=128, num_layers=30, context_dim=4096
#   - wan21_vace_1_3b    : dim=1536, num_heads=12, head_dim=128, num_layers=30, context_dim=4096
#   - wan21_i2v_14b_480p : dim=5120, num_heads=40, head_dim=128, num_layers=40, context_dim=4096
#
# Resolution: any height/width with height % 32 == 0 and width % 32 == 0 for
# wan22_ti2v_5b; VACE-1.3B only supports 480x832 or 720x1280; I2V-14B-480P
# expects 480x832 first-frame conditioning. Actual training resolution is set
# by the dataloader config.
#
# `from_scratch: true` keeps the Wan DiT structure but discards the loaded
# DiT weights and re-initializes them from PyTorch defaults. VAE and text
# encoder still load pretrained weights and are frozen by the
# training_strategy yaml. Use this for "pretrained DiT vs from-scratch DiT"
# ablations. Reproducibility is governed by `cfg.project.seed` (applied by
# OpenWAMTrainer before architecture construction).
#
# IMPORTANT: `name` is only used for registry dispatch (all wan variants share
# one adapter); the actual backbone loaded is determined entirely by
# `model_path`. CLI overrides must update BOTH fields together — overriding
# only `name` silently loads whatever `model_path` still points at. A
# normalize-and-match cross-check in `build_training_pipeline` logs a WARNING
# on mismatch but does not abort.
#
# ## Wan variant switching --------------------------------------------------
# To switch among Wan variants, comment out the active block and uncomment
# ONE alternative below. Keep `name` and `model_path` paired.
#
#   # name: wan21_vace_1_3b
#   # model_path: /path/to/Wan2.1-VACE-1.3B
#   # from_scratch: false
#
#   # name: wan21_i2v_14b_480p
#   # model_path: /path/to/weights/Wan2.1-I2V-14B-480P
#   # from_scratch: false

name: wan22_ti2v_5b
model_path: /path/to/Wan2.2-TI2V-5B  # [Required] Path to your own directory
from_scratch: false
# MUST match encoder.spec.temporal_compression / causal_temporal.
# Wan VAE         = (4, True)   ← default
# V-JEPA 2 / 2.1  = (4, True)   ← ViT tubelet=2 + encoder-side time-pool stride=2 (Wan VAE 同构)
# DINOv3          = (1, False)  ← per-frame, no tubelet
# Together with dataset.num_frames / video_stride must satisfy:
#   if causal_temporal:  (num_video_frames - 1) % temporal_compression == 0
#   else:                 num_video_frames      % temporal_compression == 0
# base.py asserts these against the constructed encoder; mismatch = fail-fast.
temporal_compression: 4
causal_temporal: true
shift_video: null
# External encoder swap. Only consumed when from_scratch=true; when
# from_scratch=false the block is silently ignored (an INFO log is emitted
# so users debugging can find the answer). Default `wan_vae` reproduces
# the native pipe.vae path bit-for-bit (the default hooks on VideoEncoder
# produce Wan-original Conv3d/Linear shapes). To swap in a non-VAE
# encoder, change `name` to a registered alternative and update
# `model_path` to its weights directory — see docs/external_video_encoder.md.
encoder:
  name: wan_vae
  model_path: /path/to/Wan2.2-TI2V-5B

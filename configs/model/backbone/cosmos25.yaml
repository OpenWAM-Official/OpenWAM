# @package model.video_backbone
# Cosmos-Predict2.5 2B video backbone for the dual-system framework.
#
# Composed into framework yamls (e.g. dual_system.yaml) via the Hydra
# `backbone` group; the `@package` directive above flattens these fields
# into `cfg.model.video_backbone.*` (matching the consumer in
# openwam/model/registry.py:resolve_architecture_config).
#   defaults:
#     - backbone: cosmos25
# Or on CLI:
#   bash scripts/train.sh model=dual_system model/backbone=cosmos25
#
# DiT geometry (auto-consumed by the architecture):
#   cosmos25_predict_2b : dim=2048, num_heads=16, head_dim=128, num_layers=28, context_dim=1024
#
# VAE: Wan2pt1 tokenizer (stride 4×8×8, z_dim=16). Actual training resolution
# is set by the dataloader config.
#
# Supported variants: joint_cross_attn (MVP) and joint_self_attn (§17). idm
# is NOT supported on Cosmos25 — the adapter raises NotImplementedError. Set
# `architecture.variant` in `configs/model/dual_system.yaml` accordingly.
#
# Freeze policy lives in `configs/training_strategy/joint.yaml`'s `freeze:`
# list (Wan-aligned mechanism). For Cosmos25 the list pins `_pipe._vae_inner`
# and `_pipe._reason1_inner`; the DiT (`_pipe.net`) is TRAINABLE by default
# (Wan-aligned: Wan DiT at `_pipe.dit` is also trainable). If you don't want
# a trainable Cosmos DiT (action branch + bridges only), uncomment the
# `_pipe.net` entry in an override training_strategy yaml — do NOT re-add a
# `freeze:` knob here.
#
# Text-context contract: either `text_encoder=reason1_live` (inline ~14 GB
# Qwen2.5-VL — §14) or an offline `pre_encoded_text` cache referenced via
# `dataloader.text_embedding_cache_dir` (§10). At least one must be
# reachable, else `preprocess_input` raises ValueError. The §16 cleanup
# removed the legacy `synthetic_inputs` plumbing-fallback path. CFG
# inference (§15): `prepare_inputs_for_inference` accepts the caller's
# `pre_encoded_text` (via `inference.text_embedding_cache_dir`) or the
# configured live encoder — same "at least one must be reachable" contract.
#
# ----------------------------------------------------------------------------
# REQUIRED architecture-side overrides when switching to Cosmos25
# ----------------------------------------------------------------------------
# The Cosmos25 context_dim is 1024 (not Wan's 4096). The `text_dim: 4096`
# default in `configs/model/dual_system.yaml`'s `action_backbone:` block
# silently overrides the auto-resolve and crashes the action expert's
# context embedding with a shape mismatch. Override on CLI or in a local
# override yaml:
#   model.action_backbone.text_dim=1024
#
# For variant=joint_cross_attn (MVP default), additionally pin the action
# self-attention space to 16×64=1024 (auto-resolve would give 16×128=2048,
# parity with Cosmos25, but the action residual stream is only 1024 wide so
# a 2048-d attention wastes Q/K/V/output_proj compute). Append on CLI:
#   +model.action_backbone.num_heads=16 +model.action_backbone.attn_head_dim=64
# DO NOT append these for joint_self_attn — MoT mixed attention requires
# per-layer parity with Cosmos25 (16/128), so the action side must
# auto-resolve to 16×128.

name: cosmos25_predict_2b
# Cosmos-Predict2.5 bundle root. Each variant subdir (`base/post-trained`,
# ...) holds a single `<uuid>_ema_bf16.pt` that `build_cosmos25_pipeline`
# globs for. Update for the active host.
model_path: /path/to/assets/Cosmos-Predict2.5-2B
model_variant: base/post-trained                    # base/{pre,post}-trained | base/distilled | auto/multiview | robot/multiview-agibot | robot/action-cond

# text_encoder choices:
#   none          - caller supplies `pre_encoded_text` (offline cache path, §10).
#   reason1_live  - inline Cosmos-Reason1-7B (§14); requires `text_encoder_path`.
# When BOTH `text_encoder=reason1_live` AND `dataloader.text_embedding_cache_dir`
# are set, the cache wins per-sample (the live encoder is silently skipped).
text_encoder: none
text_encoder_path: null                             # required when text_encoder=reason1_live; e.g. /path/to/assets/Cosmos-Reason1-7B

# CFG dropout for the live encoder path (§14.7). With probability p,
# `Cosmos25PipelineWrapper.preprocess_input` substitutes `""` for each
# prompt before calling the live encoder, so the encoder emits the
# canonical empty-prompt embedding. Only fires when `self.training=True`
# (eval mode is set by `deploy/model_loader.py:161` + defensive
# `base.py::generate`). Independent of `dataloader.text_embedding_dropout`,
# which covers the offline-cache path — they are per-sample mutually
# exclusive because cache > live precedence applies first.
text_encoder_dropout: 0.0
text_encoder_dropout_seed: null                     # int for reproducibility; null = nondeterministic each run.

vae: wan2pt1                                        # wan2pt1 (real Cosmos-Predict2.5 tokenizer; stride 4×8×8, z_dim=16) | none (skip VAE; caller must supply pre-encoded latents)

# Cosmos flow_shift — matches upstream
# `cosmos_predict2/_src/predict2/models/text2world_model_rectified_flow.py:99`
# (`shift: int = 5`) and the released `rectified_flow_shift5_high_sigma`
# checkpoint family. Training target `noise - sample` and noising
# `x_t = (1-σ)·sample + σ·noise` are identical to Wan's default.
flow_shift: 5.0

sac_mode: none

# Recommended video-DiT learning rate for Cosmos25, read by
# `configs/train.yaml` via `${oc.select:model.video_backbone.recommended_video_lr,null}`.
# Cosmos25 uses uniform timestep weighting (see
# openwam/model/video_backbone/cosmos25/scheduler.py:73-88) vs Wan's
# bell-shape, so the same `training.learning_rate=1e-4` is more aggressive
# on the Cosmos video stream. 2e-5 is a conservative starting point for
# fine-tuning the pretrained Cosmos DiT; set to null to fall back to the
# base learning_rate (Wan-equivalent behavior). Action backbone is
# unaffected — it has its own `training.action_lr` knob.
recommended_video_lr: 2.0e-5

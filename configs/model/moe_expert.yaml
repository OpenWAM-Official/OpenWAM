# MoE Action Expert Architecture (BAGEL MoT-inspired)
# Action tokens concatenated to video sequence with shared self-attention.
# Expert FFN layers provide modality-specific capacity at designated layers.

architecture:
  type: moe_expert
  action_dim: 20
  expert_ffn_dim: 4096
  # len(bridge_layers) auto-determines num_experts.
  bridge_layers: [3, 7, 11, 15, 19, 23, 26, 29]  # TI2V-5B/VACE-1.3B: 30 layers (index 0-29)

# Video backbone
# Resolution: any height/width where height % 32 == 0 and width % 32 == 0.
# Actual training resolution is determined by dataloader config.
video_backbone:
  name: ti2v_5b
  model_path: /path/to/Wan2.2-TI2V-5B  # [Required] Path to your own directory

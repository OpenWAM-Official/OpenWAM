# Shared-Backbone WAM: action tokens concatenated into the video DiT sequence.
# Variant via `architecture.variant`: vanilla (plain shared DiT) | moe (+ expert
# FFN on action tokens). Action tokens project directly to video_backbone.dim.
# Video backbone from the `video_backbone` group (default Wan22).

defaults:
  - video_backbone: wan22             # default Wan22 TI2V-5B; CLI: model/video_backbone=wan21
  - action_backbone: shared_action_backbone
  - _self_

# Frozen pretrained components (freeze_modules walks each via get_submodule;
# missing paths silently skipped — image_encoder None on TI2V/VACE, _encoder
# only on the from_scratch external-encoder path).
freeze:
  - video_backbone.text_encoder
  - video_backbone.vae
  - video_backbone.image_encoder
  - video_backbone.video_encoder

architecture:
  framework: shared_backbone
  variant: vanilla   # vanilla | moe; CLI: model.architecture.variant=moe
  action_dim: 20

  # When true, dataloader must provide sample["proprio"] ([state_dim] or
  # [1, state_dim]); encoded as one state token after the action tokens:
  #   [video tokens][action tokens][state token].
  use_proprioception: true
  state_dim: 20

  # joint mask: v↔v from video_attention_mask_mode; v→state True / v→action False;
  # action→all True; state→state True / state→{v,a} False.
  attention_mask_mode: joint   # joint | bidirectional
  video_attention_mask_mode: first_frame_causal   # first_frame_causal | per_frame_causal | bidirectional

  # moe only: which video DiT layers apply an expert FFN to action tokens
  # (vanilla ignores). Same schema/name as dual/tri_system bridge_layers.
  # bridge_layers: explicit list, OR null + bridge_interval (1=all, 2=every other).
  bridge_layers: null
  bridge_interval: 1

type: robocasa_gr1

# Input must already contain reliable bimanual EEF pose/gripper columns. The
# public NVIDIA joint44 files do not; enrich them before running the re-indexer:
#   python scripts/convert_robocasa_gr1_v20_to_v30.py \
#     --input /path/to/robocasa-gr1-eef-v20 \
#     --output /path/to/robocasa-gr1-eef-v30
dataset_dir: /TODO/robocasa_gr1_eef_v30

# Only EEF is supported:
# raw EEF20 = [L xyz3+rot6d6+grip1, R xyz3+rot6d6+grip1].
# The converted source stores Euler pose12 + gripper2 columns; the reader
# assembles them into EEF20 (Euler -> rot6d). If a conversion exports final
# 20D vectors directly, set eef_action_column / eef_state_column instead and
# null the pose+gripper columns.
action_mode: eef

eef_action_column: null
eef_state_column: null
eef_pose_action_column: eef_sim_pose_action
eef_gripper_action_column: gripper_open_scale_action
eef_pose_state_column: eef_sim_pose_state
eef_gripper_state_column: gripper_open_scale_state

# Native annotation.human.coarse_action is an integer class ID, not text.
# Resolve task_index through converted meta/tasks.parquet. Missing/blank prompt
# metadata is an error.
prompt_columns: []

# Camera key resolution by info.json features priority. Missing wrist views are
# rendered as black slots in multiview mode.
head_camera_priority:
  - observation.images.ego_view
  - observation.images.ego_view_rgb
  - observation.images.ego_rgb
  - observation.images.head_rgb
  - observation.images.cam_head_rgb
  - observation.images.cam_high_rgb
left_wrist_camera_priority:
  - observation.images.left_wrist
  - observation.images.left_wrist_rgb
  - observation.images.cam_left_wrist_rgb
right_wrist_camera_priority:
  - observation.images.right_wrist
  - observation.images.right_wrist_rgb
  - observation.images.cam_right_wrist_rgb

num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
split: train
enable_action_supervision: true

# null disables in-reader normalization. Set to min-max or z-score after
# generating normalization_stats.npy with
# openwam/dataloader/utils/stats_computation/robocasa_gr1_stats_computation.py.
normalize_mode: null
normalization_stats_path: null

# Normalize EEF20 first, then scatter each arm's 10D into the shared EEF slots.
# The base LeRobot v3 reader automatically masks all unmapped 80-D slots.
unify_action: true
unify_action_map: ["0-9", "34-43"]
# Raw EEF20 has no hidden dimensions; masks become false only for the unmapped
# unified slots after scatter.
state_mask: &eef20_all_visible
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
  - true
action_mask: *eef20_all_visible

# Load-time, temporally consistent augmentation (train split only).
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

type: robocasa_gr1

# Input must already contain simulator-backed EEF33 columns. The public NVIDIA
# joint44 files do not; enrich them before running the re-indexer:
#   python scripts/enrich_robocasa_gr1_joint44_to_eef33.py \
#     --input /path/to/robocasa-gr1-v20 \
#     --output /path/to/robocasa-gr1-eef33-v20
#   python scripts/convert_robocasa_gr1_v20_to_v30.py \
#     --input /path/to/robocasa-gr1-eef33-v20 \
#     --output /path/to/robocasa-gr1-eef33-v30
dataset_dir: /TODO/robocasa_gr1_eef33_v30

# Only EEF is supported. Raw EEF33:
# [L xyz3+rot6d6+hand6, R xyz3+rot6d6+hand6, waist3].
action_mode: eef
eef_action_column: eef33_action
eef_state_column: eef33_state

# Native annotation.human.coarse_action is an integer class ID, not text.
# Resolve task_index through converted meta/tasks.parquet. Missing/blank prompt
# metadata is an error.
prompt_columns: []

# Camera key resolution by info.json features priority. Missing wrist views are
# rendered as black slots in multiview mode.
head_camera_priority:
  - observation.images.ego_view
  - observation.images.ego_view_rgb
  - observation.images.ego_rgb
  - observation.images.head_rgb
  - observation.images.cam_head_rgb
  - observation.images.cam_high_rgb
left_wrist_camera_priority:
  - observation.images.left_wrist
  - observation.images.left_wrist_rgb
  - observation.images.cam_left_wrist_rgb
right_wrist_camera_priority:
  - observation.images.right_wrist
  - observation.images.right_wrist_rgb
  - observation.images.cam_right_wrist_rgb

num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
split: train
enable_action_supervision: true

# null disables in-reader normalization. Set to min-max or z-score after
# generating normalization_stats.npy with
# openwam/dataloader/utils/stats_computation/robocasa_gr1_stats_computation.py.
normalize_mode: null
normalization_stats_path: null
# Action commands and achieved proprio use separate statistics.
state_stats_mode: eef_state

# Normalize EEF33 first, then scatter arm poses, Fourier hands, and waist into
# the shared EEF/dex-hand/reserved slots. Gripper slots 9/43 stay unmapped.
unify_action: true
unify_action_map: ["0-8", "10-15", "34-42", "44-49", "68-70"]
# Raw EEF33 has no hidden dimensions; masks become false only for the unmapped
# unified slots after scatter.
state_mask: &eef33_all_visible
  [true, true, true, true, true, true, true, true, true, true, true,
   true, true, true, true, true, true, true, true, true, true, true,
   true, true, true, true, true, true, true, true, true, true, true]
action_mask: *eef33_all_visible

# Load-time, temporally consistent augmentation (train split only).
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

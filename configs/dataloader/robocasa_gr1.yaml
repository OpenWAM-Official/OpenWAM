type: robocasa_gr1

# Convert the NVIDIA LeRobot v2.0 download first:
#   python scripts/convert_robocasa_gr1_v20_to_v30.py \
#     --input /path/to/robocasa-gr1-24k \
#     --output /path/to/robocasa-gr1-v30
dataset_dir: /TODO/robocasa_gr1_v30

# The public gr1_unified.*_1000 buckets contain native 44-D joint/body vectors,
# not EEF poses. This is the only honest default for the downloaded dataset.
# joint: raw joint vectors from action/state columns; requires action_dim.
# eef:   20D [L xyz+rot6d+grip, R xyz+rot6d+grip].
# unify: normalize raw 20D EEF, then scatter through the shared base reader into
#        the 80D pretraining space. Requires an EEF-enriched conversion; see
#        robocasa_gr1_unify.yaml. Never relabel the native 44-D joints as EEF20.
action_mode: joint
action_dim: 44

# Native v2.0/v3-reindexed columns.
joint_action_column: action
joint_state_column: observation.state

# Native annotation.human.coarse_action is an integer class ID, not text.
# Resolve task_index through converted meta/tasks.parquet. Missing/blank prompt
# metadata is an error.
prompt_columns: []

# Camera key resolution by info.json features priority. Missing wrist views are
# rendered as black slots in multiview mode.
head_camera_priority:
  - observation.images.ego_view
  - observation.images.ego_view_rgb
  - observation.images.ego_rgb
  - observation.images.head_rgb
  - observation.images.cam_head_rgb
  - observation.images.cam_high_rgb
left_wrist_camera_priority:
  - observation.images.left_wrist
  - observation.images.left_wrist_rgb
  - observation.images.cam_left_wrist_rgb
right_wrist_camera_priority:
  - observation.images.right_wrist
  - observation.images.right_wrist_rgb
  - observation.images.cam_right_wrist_rgb

num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
split: train
enable_action_supervision: true

# null disables in-reader normalization. Set to min-max, z-score, or quantile after
# generating normalization_stats.npy with
# openwam/dataloader/utils/stats_computation/robocasa_gr1_stats_computation.py.
normalize_mode: null
normalization_stats_path: null

# Native joint44 cannot be scattered into semantic EEF80 slots.
unify_action: false
unify_action_map: null
state_mask: null
action_mask: null

# Load-time, temporally consistent augmentation (train split only).
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

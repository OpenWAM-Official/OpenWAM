type: behavior

# ── Dataset root ────────────────────────────────────────────────────────────
# BEHAVIOR-1K 2025-challenge demos (LeRobot v2.1, robot R1Pro). One parquet per
# episode under data/task-{chunk:04d}/episode_{idx:08d}.parquet + meta/episodes.jsonl.
# Only RGB videos are read (head + 2 wrists); depth / seg streams are ignored.
# Episodes whose parquet is not on disk (partial download) are auto-skipped.
dataset_dir: /path/to/datasets/behaviour-1k

# ── Window / stride ─────────────────────────────────────────────────────────
# Match robocoin / robotwin so a mixture batch collates without per-source resize.
# 33 frames, stride 4 → 9 video frames; (num_video_frames - 1) % 4 == 0 (Wan VAE).
num_frames: 33
video_stride: 4
window_stride: 1

# ── Image size / multiview ──────────────────────────────────────────────────
# Two modes:
#   multiview: true  → L-shape canvas (head 256x320 top, L/R wrist 128x160 bottom).
#       height MUST be 384 and width 320 (the fixed canvas) — the reader fails fast
#       on any other size in multiview mode. A missing wrist stream is blacked out.
#   multiview: false → single ego (head) frame at exactly (height, width), no canvas.
#       For the spec's 256x320 single-view ego: set multiview: false, height: 256,
#       width: 320 (wrist streams are ignored). Any (height, width) is allowed here.
# Head cam = observation.images.rgb.head (720^2),
# wrists    = observation.images.rgb.{left,right}_wrist (480^2).
height: 384
width: 320
multiview: true

# ── Video color jitter (optional, TRAIN split only) ─────────────────────────
# Load-time color jitter the reader applies to each decoded clip with the SAME
# random factors across all frames (temporal consistency), TRAIN split only — so
# val / deploy video stays byte-identical. This block is the on/off switch:
# present (a dict) → enabled; comment it out, or set to null / false → disabled.
# Strengths are the max ± fractional change per channel; hue is a no-op in PIL
# mode (kept for API parity → leave 0.0). Applied to the assembled L-shape canvas
# after multiview composition (same reader hook robocoin uses).
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

# ── Action normalization ────────────────────────────────────────────────────
# Loads meta/stats_R1Pro.json (eef 20-D + base_vel 3-D + trunk 4-D). rot6d dims are pinned to
# identity in the stats file (no normalization), matching robocoin. Generate via:
#   python -m openwam.dataloader.utils.stats_computation.behavior_stats_computation \
#       --dataset_dir <dataset_dir>
#   null / "none" → no normalization (raw values)
#   "min-max" (default) / "z-score" / "quantile"
#
# min-max, NOT the robocoin-family quantile: BEHAVIOR is a closed-loop scored
# BENCHMARK, and quantile saturates every beyond-q99 training target to 1.0 —
# the supervision that distinguishes fast commands is erased, so the learned
# policy effectively tops out near q99 (a soft cap; deploy unnormalize itself
# does not clamp). In the relevant normalization distribution the base-velocity dims [20:22)
# have q99 is substantially below max — a fraction of the demos' top speed —
# a direct handicap under mobile long-horizon step budgets. quantile's
# outlier robustness is the right default for PRETRAIN corpora (robocoin/OXE)
# that never deploy closed-loop; benchmarks pay for it with expressiveness.
normalize_mode: min-max

# ── Action / proprio supervision ────────────────────────────────────────────
# Contract: a sample's PROPRIO is the MEASURED observation.state at t=0 (achieved
# eef pose + gripper open-scale + base-frame velocity + trunk qpos, decoded from
# the robot's proprio_obs layout); the TARGET is the action sequence
# action[0..T_action-1] (row-aligned recorded commands; the eef arm target is the
# next-frame achieved pose = the EEF rendering of the arm's joint setpoint). Proprio
# is NOT the action command — at deploy the model only ever sees the achieved state,
# so training on the command would cause covariate-shift drift. The deploy bridge
# (benchmarks/utils/action_conversion.r1pro_proprio_to_raw27) renders the same
# achieved-state → raw-27 proprio, byte-checked against the reader.
enable_action_supervision: true

# ── Unified 80-D action space (cross-robot shared head) ─────────────────────
# unify_action=true scatters the raw 27-D vector into the shared 80-D space; the
# per-dim mask keeps unmapped (dexterous + reserved) slots out of the loss.
# 80-D semantic layout (== robocoin.yaml):
#   [ 0: 3) L eef xyz   [ 3: 9) L eef rot6d   [ 9]    L gripper
#   [10:34) L hand(24)  [34:37) R eef xyz     [37:43) R eef rot6d
#   [43]    R gripper   [44:68) R hand(24)    [68:80) reserved(12)
# R1Pro has parallel grippers (no dexterous hand) → the 24 hand dims/arm stay 0 +
# masked. The reserved region holds the mobile base + torso: base velocity
# [vx,vy,vyaw] → [68:71) (Ilia Larchenko's design), torso 4 abs joints → [71:75);
# [75:80) stay reserved + masked.
# Raw 27-D layout: [L_pos3, L_rot6d6, L_grip1, R_pos3, R_rot6d6, R_grip1, base3, trunk4];
# the map scatters raw 0-9 → L (0-9), 10-19 → R (34-43), 20-22 → base (68-70),
# 23-26 → trunk (71-74).
# action_dim becomes 80 → set model.architecture.action_dim=80 state_dim=80.
unify_action: true
unify_action_map: ["0-9", "34-43", "68-70", "71-74"]

# ── Action representation mode ──────────────────────────────────────────────
# Selects the action/proprio representation the reader emits (BEHAVIOR's three
# action modes). It ALSO names the meta/normalization_stats.npy stats sub-dict the
# reader writes and the deploy side reads back (the two must match), so this value
# is baked into the checkpoint config → self-contained deploy.
#   unified — EEF (xyz+rot6d per arm), scattered into the shared 80-D space when
#             unify_action: true (the default cross-robot path; raw 27 = eef20 +
#             base3 + trunk4). At deploy _build_normalizer gathers the model's 80-D
#             output back to raw-27 THEN denormalizes (PR #17 _UnifyAwareNormalizer).
#   eef     — the same raw 27-D EEF vector emitted directly (no unify scatter),
#             all dims visible. Set unify_action: false.
#   joint   — raw 23-D [L_arm7, L_grip1, R_arm7, R_grip1, base3, trunk4] read
#             straight from the native action[23] JointController setpoints
#             (左臂+夹爪 / 右臂+夹爪 / 其他 order), all dims visible. Set
#             unify_action: false (joint angles are NOT meaningful in the 80-D
#             EEF-semantic unified space → joint + unify_action: true is rejected).
#             Needs the 'arm_joint' stats block → re-run behavior_stats_computation.
# NOTE: BEHAVIOR's native action[23] DOES carry 7+7 arm-joint columns
# (action[7:14] / [15:22]); the eef/unified path deliberately discards them and
# reconstructs an EEF pose from observation.state quaternions (then lets OmniGibson
# IK recover joints at deploy). joint mode reads those native columns directly — so
# all three modes are genuinely supported, joint is a design alternative not a
# data gap. Mirrors RoboTwin's action_mode={joint,eef} switch (extended with the
# unified-80d alias for the cross-robot default).
#
# Dim order (family convention 「左臂+夹爪 / 右臂+夹爪 / 其他」): every mode orders
# dims L_arm(+grip) / R_arm(+grip) / 其他 tail. The 其他 tail is base(底盘) then
# trunk(腰) — a fixed internal order, set-equal to the rubric's 「其他(腰部/移动底
# 盘)」 (only the within-tail order differs), kept identical across reader + stats
# + unify_action_map + deploy. Masks: joint/eef emit all dims visible (no mask);
# unified follows the unify rule (only mapped slots valid, dex + reserved masked).
action_mode: unified

# ── Data budget (optional) ──────────────────────────────────────────────────
# null = full dataset; positive float = subsample episodes to ~N hours of footage.
total_hours: null

type: ebench
dataset_dir: /path/to/data_lake/EBench-Dataset

# EBench buckets. Default covers both requested evaluation families.
# To smoke-test a tiny subset:
#   dataloader.buckets=[simple_pnp/task1,teleop_tasks/peg_in_hole] dataloader.groups=null
groups: [simple_pnp, teleop_tasks]
buckets: null

# 80-D OpenWAM semantic action space:
#   [0:3) L eef xyz, [3:9) L eef rot6d, [9] L gripper, [10:32) L hand
#   [32:35) R eef xyz, [35:41) R eef rot6d, [41] R gripper, [42:64) R hand
#   [64:80) reserved
#
# EBench raw 19-D:
#   action.joints[0:6]  -> left hand slots 10:16
#   action.joints[6:12] -> right hand slots 42:48
#   action.gripper[0:2] -> left hand slots 16:18 and mean -> scalar slot 9
#   action.gripper[2:4] -> right hand slots 48:50 and mean -> scalar slot 41
#   action.base[0:3]    -> reserved slots 64:67
action_mode: ebench80
action_key_variant: absolute_base # absolute_base matches EBench baseline chunk output; delta_base uses action.base_delta

# --- Frame sampling ---
num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
split: train

# --- Multi-view composition ---
# EBench baseline clients use overlook as the head camera and left/right wrist
# cameras as hand views. Set multiview=false to use target_camera only.
multiview: true
target_camera: video.overlook_camera_view
camera_layout: [video.overlook_camera_view, video.left_camera_view, video.right_camera_view]

# --- Normalization ---
# The reader builds a shared 80-D stats cache from meta/episodes_stats.jsonl on
# first load and reuses it afterward. Action uses action.* stats; proprio uses
# state.* stats. Only mapped dims are normalized and supervised.
normalize_mode: z-score           # "z-score", "min-max", or null
normalization_stats_path: /path/to/data_lake/EBench-Dataset/meta/ebench80_stats.npy

type: ebench
dataset_dir: /path/to/ebench_data

# Raw-23: L xyz/rot6d/gripper, R xyz/rot6d/gripper, base dx/dy/dyaw (degrees).
# ee_pose uses wxyz quaternions; each hand's finger values are averaged.
# The three ranges below map raw values into the unified action space.
action_mode: eef
unify_action: true
unify_action_map: ["0-9", "34-43", "68-70"]
unify_state_map: null  # null = state reuses unify_action_map

# Frame and window sampling.
num_frames: 33
video_stride: 4
window_stride: 1
split: train

# Camera layout and output size.
height: 384
width: 320
multiview: true
camera_layout: [video.overlook_camera_view, video.left_camera_view, video.right_camera_view]
target_camera: video.overlook_camera_view

# Raw-23 stats cache; a missing file is built by the reader.
normalize_mode: min-max           # "min-max", "z-score", "quantile", or null

# Optional train-only color jitter.
color_jitter:
  enabled: true
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

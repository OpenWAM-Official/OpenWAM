type: robocasa365

# ── Dataset root ─────────────────────────────────────────────────────────────
# Points at the RAW RoboCasa365 download (LeRobot v3.0 aggregated repo, read directly — no
# migration/conversion). v3 packs ALL tasks into ONE repo (e.g. the HF mirror
# ember-lab-berkeley/robocasa365-pretrain-{atomic,composite}); each episode is tagged by
# source_prefix (<split>/<atomic|composite>/<Task>/<date>).
#   - task_name set   → single task (filter the repo to that source_prefix)
#   - task_name null  → multi-task: every task in the repo (or the task_roots subset), one
#                       RoboCasa365Dataset per task, concatenated, sharing ONE pooled stats file.
# Full RoboCasa365 (all tasks, mobile + fixed): the mobile base command is trained (mobile_base=true
# below), so tasks are no longer filtered to a fixed-base subset. Eval targets the official 50 target
# tasks (see benchmarks/robocasa365/).
#
# dataset_dir may be a single repo OR a LIST of repos. The full 300 train tasks live in TWO separate
# HF repos (65 atomic + 235 composite): pass both to train over all of them, e.g.
#   dataset_dir: [/path/to/robocasa365-pretrain-atomic, /path/to/robocasa365-pretrain-composite]
# Tasks are discovered across all listed repos (atomic/composite task sets are disjoint). Multi-repo
# REQUIRES an explicit normalization_stats_path (see below) — there is no single root to auto-place
# the shared stats file.
dataset_dir: /path/to/robocasa365-pretrain-atomic
task_name: null                   # null = every task across all repos; set a name = filter to one task (source_prefix)
task_roots: null                  # optional list of task NAMES to include (a subset); overrides full discovery

# ── Frame sampling (aligned with OXE / RoboCOIN / RoboTwin) ──────────────────
# num_frames   = state window length in raw frames; action horizon = num_frames - 1.
# video_stride = video-only stride; state/action stay at raw rate.
# video length = (num_frames - 1) // video_stride + 1   (must divide evenly)
# proprio = eef_pose[0:1] (1, 20); action = eef_pose[1:num_frames] (num_frames-1, 20).
num_frames: 33
video_stride: 4
window_stride: 1
repeat: 1

# ── Image size / multi-view L-shape (FastWAM-compatible) ─────────────────────
# multiview=true → L-shape canvas 384H×320W (matches the deploy server's compose,
# so train/eval frames stay in-distribution):
#   +---------------------------+   top  256H×320W → robot0_agentview_left (head)
#   |          head             |
#   +-------------+-------------+   bot-L 128H×160W → robot0_eye_in_hand (the arm's wrist)
#   |    wrist    |   BLACK     |   bot-R 128H×160W → BLACK (single-arm: no 2nd wrist)
#   +-------------+-------------+
# When multiview=true, height MUST be 384 and width MUST be 320.
height: 384
width: 320
multiview: true
# Override the 3-slot layout if needed (top, bot-left, bot-right). The sentinel
# "__missing_right_wrist__" renders a black slot. Default fills head + wrist + black.
camera_layout: null

# ── Train / val split ────────────────────────────────────────────────────────
split: train
val_ratio: 0.0                    # fraction of episodes reserved for validation
seed: 42

# ── Static-segment filtering (mirrors robotwin) ──────────────────────────────
# Train-only: resample windows that "haven't started moving" (first raw EEF step's
# max-abs < threshold) so the model isn't taught to output ~zero motion. Val stays
# deterministic; no-op when there is only one window.
filter_static_segments: true
static_segment_threshold: 1.0e-5  # max-abs of the first NORMALIZED action-vs-proprio step below which a window is static (robotwin parity)
max_static_retry: 3               # resample attempts before keeping a static window

# ── Action / proprio (single-arm 20-D EEF) ──────────────────────────────────
# RoboCasa365 is single-arm: action & proprio are BOTH the absolute EEF pose from
# observation.state — eef_pos(3) + eef_rot(quat→rot6d, 6) + gripper(1) → the LEFT
# 10 dims of the bimanual 20-D EEF (right 10 zero-padded + masked).
# action_mode MUST be eef: the deploy server (model_loader) reads dataloader.action_mode
# to pick the normalizer's stats key; without it deploy defaults to 'joint', finds no
# 'joint' stats, and silently disables de-normalization.
action_mode: eef
# Stats are persisted at the full 20-D action dim so the deploy normalizer can invert the
# model's 20-D output. Auto-resolve and, if absent, auto-compute on first load to
# {data_root}/{task}_eef_stats.npy (precompute via
# `python -m openwam.dataloader.robocasa365_stats_computation <bucket>`).
#   null / "none" → no normalization (raw physical units)
#   "min-max"     → rescale each dim into [-1, 1] using {min, max}   [default; deploy-resolvable]
#   "z-score"     → (x - mean) / std                                  [deploy-resolvable]
# (quantile is NOT supported here — the deploy normalizer can't invert it, so the dataloader
#  rejects it rather than let a checkpoint silently lose normalization at serve time.)
normalize_mode: min-max
normalization_stats_path: null    # explicit stats .npy/.json; null = auto-resolve under the (single) repo.
                                  # REQUIRED (non-null) when dataset_dir is a list of repos — the pooled
                                  # stats over all tasks×repos are computed to this path on first use.

# ── Unified 80-D action space (cross-robot shared head) + mobile base ────────
# unify_action=true scatters this reader's 20-D EEF into a shared UNIFY_DIM (80) vector so
# heterogeneous robots train one action head (like robotwin/robocoin/oxe_bcz).
# 80-D layout: [0:10) left eef (pos3+rot6d6+grip1)  [10:34) left hand  [34:44) right eef
#              [44:68) right hand  [68:80) reserved. RoboCasa365 is single-arm: the real arm
# lands in the LEFT eef slots (0-9, valid); the zero-padded right half maps to 34-43 but stays
# masked out of the loss (LEFT_ARM_DIM_MASK is honored through the scatter).
unify_action: true
unify_action_map: ["0-9", "34-43"]  # raw left-arm 0-9 → unified 0-9, raw right-arm 10-19 → 34-43
#
# mobile_base=true (requires unify_action): read the RoboCasa-native base COMMAND raw from the
# LeRobot action field ([x/y/yaw velocity, torso position, control_mode]) and scatter it into the
# reserved slots [68:73) (ACTION side only; direct-to-env at eval, no bridge). See
# docs/plans/robocasa365-full-mobile.md.
mobile_base: true
#
# base_proprio_velocity=true (requires unify_action; changes the PROPRIO definition → RETRAIN to take
# effect): put the current body-frame base velocity [vx, vy, vyaw] (finite-diff of observation.state
# base_position, world→body) into PROPRIO [68:71). World-frame base POSE is scene-arbitrary, but its
# body-frame VELOCITY is scene-invariant and symmetric with the action's commanded base velocity
# ([68:71) proprio = current, [68:71) action = commanded). torso[71] + control_mode[72] have no
# observable current-state source, so they stay masked in proprio. The eval client derives the SAME
# velocity from the sim obs and sends 23-D proprio [arm20, base_vel3]; the deploy server normalizes it
# with the 'base_vel' stats block and scatters to [68:71). Stats file gains a 3-D 'base_vel' block and
# a '..vel_' suffix. Default false (proprio stays 20-D EEF; existing ckpts unaffected).
base_proprio_velocity: false
#
# Model head + proprio dims must be 80 when unify_action=true. As of the main merge,
# configs/model/dual_system.yaml already defaults to action_dim=80 / state_dim=80 (the unified
# cross-robot head), so NO override is needed for the default model. Only if you point at a model
# config that hardcodes 20 do you still need:
#   scripts/train.sh dataloader=robocasa365 model.architecture.action_dim=80 model.architecture.state_dim=80 ...
# Deploy needs no extra flag: model_loader reads unify_action/unify_action_map/mobile_base/
# base_proprio_velocity from the saved config and wraps _UnifyAwareNormalizer (action OUT: gathers
# 80->25 = arm20+base5; proprio IN: scatters base_vel3 into [68:71)), so the eval client bridges arm
# (20->OSC), sends base raw, and (when base_proprio_velocity) sends 23-D proprio [arm20, base_vel3].
# Base stats live under "base", base velocity under "base_vel", in the auto-computed stats .npy.

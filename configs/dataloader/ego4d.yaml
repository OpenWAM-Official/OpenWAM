type: ego4d
# ── Dataset root ────────────────────────────────────────────────────────────
# `dataset_dir` can point at either:
#   1. A single group bucket (a directory that directly contains `meta/info.json`),
#      e.g. /path/to/Ego4D/group_00, or
#   2. The root directory whose immediate subdirs are the 12 `group_XX` buckets
#      (each with their own `meta/info.json`).
# Mode (2) is the production path: `Ego4DDataset.from_config` discovers all 12
# groups and wraps them in a `MultiBucketEgo4DDataset`. No per-bucket yaml
# entries needed. (Egocentric human-hand LeRobot v3, robot_type "ego_hand".)
dataset_dir: /path/to/Ego4D

# ── Window / stride ─────────────────────────────────────────────────────────
# num_frames + video_stride match RoboCOIN / EgoDex so mixture batches collate
# without per-source resize. (33 frames, stride 4 → 9 video frames per sample.)
num_frames: 33
video_stride: 4
window_stride: 1

# ── Image size ──────────────────────────────────────────────────────────────
# 1024x768 source frames are resized down.
# When multiview=true: height MUST be 384 and width MUST be 320 — the L-shape
# canvas is top 256H + bottom 128H, bottom row halved 160W + 160W. Keep aligned
# with the other sub-datasets in mixture.yaml.
height: 384
width: 320

# ── Camera ──────────────────────────────────────────────────────────────────
# Ego4D is single-camera (head-mounted ego view).
target_camera: observation.images.ego

# ── Multiview ──────────────────────────────────────────────────────────────
# multiview: true → L-shape canvas at (384, 320):
#     top    256H × 320W → ego camera (BILINEAR-stretched to slot)
#     bot-L  128H × 160W → BLACK (Ego4D has no left wrist camera)
#     bot-R  128H × 160W → BLACK (Ego4D has no right wrist camera)
# The two "__missing_*__" sentinel names simply don't appear in the per-frame
# frames_by_camera dict, so those slots stay black.
multiview: true
camera_layout: [observation.images.ego, __missing_left__, __missing_right__]

# ── Train / val split ───────────────────────────────────────────────────────
# Honors info.json["splits"][split] when declared; otherwise split=train returns
# the full eps_df; val is not used in pretraining.
split: train
# seed comes from project.seed in train.yaml (injected at launch); the Python
# ctor falls back to 42 if neither is supplied.

# ── Video augmentation ──────────────────────────────────────────────────────
# Load-time color jitter with the SAME random factors across a clip's frames
# (temporal consistency), TRAIN split only. Omit / null / false → disabled.
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

# ── Unified action space ────────────────────────────────────────────────────
# unify_action=true widens the emitted action/proprio to the shared 80-D
# unified space (UNIFY_DIM) so Ego4D batches collate with the other mixture
# sources whose head is 80-D (robocoin/egodex set unify_action=true too). Ego4D's
# action/proprio payloads stay all-zero with all-False masks (video-only
# supervision), so no unify_action_map is needed: the identity map is used and
# every dim remains masked out of the loss.
unify_action: true

# ── Data budget (optional) ──────────────────────────────────────────────────
# total_hours: cap raw video footage used for training, in hours. null / unset
# (default) → use the full dataset (no subsampling). A positive float subsamples
# episodes across all 12 groups via water-filling, seeded by project.seed.
total_hours: null

# ── Notes on what this reader does ──────────────────────────────────────────
#  * Bilingual prompts → English only. Each task's combined "中文:…英文:…" string
#    (meta/tasks.parquet) is split on the 英文[:：] marker; only the English half
#    is used. The ~114 episodes (0.06%) whose prompt is the literal "null"
#    placeholder are dropped at init (they carry no usable instruction).
#  * Action loss is intentionally disabled. The reader emits
#      action = zeros(T-1, 80), action_mask = zeros(T-1, 80, bool),
#      proprio = zeros(1, 80),  proprio_mask = zeros(1, 80, bool).
#    Ego4D's per-frame payload is human MANO hand pose (not a robot action) and
#    has no materialized action column, so only video / image-prediction loss is
#    supervised (same contract as EgoDex).
#  * No normalization (matches EgoDex / the default robocoin behaviour).

type: libero

# LeRobot v3 dataset, recommended:
#   https://huggingface.co/datasets/nvidia/LIBERO_LeRobot_v3
# A compatible HuggingFaceVLA/libero v3 conversion is also accepted.
dataset_dir: /TODO/LIBERO_LeRobot_v3

# Only EEF is supported. Raw EEF10 (world frame, full pose):
# [xyz3, rot6d6, gripper1]. Proprio is the achieved observation.state rendered
# to EEF10; the action target is the NEXT frame's achieved pose plus the
# recorded gripper command (the eval bridge inverts back to the 7-D OSC delta).
action_mode: eef

# Normalize raw EEF10 first, then scatter into the unified 80-D left-arm slots.
# All other unified slots stay masked.
unify_action: true
unify_action_map: ["0-9"]

# nvidia/LIBERO_LeRobot_v3 uses image/wrist_image; HuggingFaceVLA/libero uses
head_camera_priority:
  - observation.images.image
  - observation.images.agentview_image
wrist_camera_priority:
  - observation.images.wrist_image
  - observation.images.image2
  - observation.images.robot0_eye_in_hand_image

# Use an in-shard language column when a conversion provides one, otherwise
# resolve task_index through meta/tasks.parquet. Absent columns are not projected.
prompt_columns:
  - language_instruction
  - task
  - prompt

num_frames: 33
video_stride: 4
window_stride: 1
height: 384
width: 320
multiview: true
split: train
enable_action_supervision: true

# null disables in-reader normalization. Set to min-max or z-score after
# generating normalization_stats.npy with:
#   python -m openwam.dataloader.utils.stats_computation.libero_stats_computation \
#     --config configs/dataloader/libero.yaml \
#     --output /path/to/libero_normalization_stats.npy
normalize_mode: null
normalization_stats_path: null
# Action commands and achieved proprio use separate statistics.
state_stats_mode: eef_state

# Load-time, temporally consistent augmentation (train split only).
color_jitter:
  brightness: 0.2
  contrast: 0.2
  saturation: 0.2
  hue: 0.0

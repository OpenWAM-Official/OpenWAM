trainer: native
debug: true                    # debug mode: 50 steps, save@10, val@25, constant LR

lambda_video: 1.0
lambda_action: 1.0
learning_rate: 1e-4
action_lr: null
video_lr: null
lora_lr: null
weight_decay: 0.01
max_grad_norm: 1.0              # max gradient norm for clipping, null = no clipping
num_epochs: 5
max_steps: null
batch_size: 1
gradient_accumulation_steps: 1
use_gradient_checkpointing: true
use_gradient_checkpointing_offload: false
max_timestep_boundary: 1.0
min_timestep_boundary: 0.0
find_unused_parameters: false

# Model loading
model_paths: /path/to/Wan2.1-VACE-1.3B
tokenizer_path: /path/to/Wan2.1-VACE-1.3B/google/umt5-xxl

initialize_model_on_cpu: false

# LoRA
lora_base_model: null
lora_target_modules: "q,k,v,o,ffn.0,ffn.2"
lora_rank: 32
lora_checkpoint: null
preset_lora_path: null
preset_lora_model: null
trainable_models: null          # only used with LoRA (lora_base_model); NativeTrainer trains all requires_grad params

# FP8 & offload
fp8_models: null
offload_models: null

# Checkpointing & logging
output_path: /path/to/openwam_checkpoints
remove_prefix_in_ckpt: "pipe.dit."
save_steps: 2000                # save checkpoint every N steps
rolling_save_steps: null
keep_last_k_ckpts: 3            # keep only the 3 most recent checkpoints
dataset_num_workers: 0

# LR Scheduler
lr_scheduler: cosine            # "cosine" or null (constant LR)
warmup_ratio: 0.05              # fraction of total optimizer steps for linear warmup
lr_min_ratio: 0.01              # cosine minimum LR = learning_rate * lr_min_ratio

# DeepSpeed ZeRO Stage 2 training preset.
#
# Usage with accelerate:
#   accelerate launch --config_file configs/accelerate/deepspeed_zero2.yaml \
#       scripts/train.py training=deepspeed_zero2 model/backbone=ti2v_5b
#
# ZeRO-2 partitions optimizer states and gradients across GPUs, significantly
# reducing per-GPU memory for large backbones (e.g. TI2V-5B).  Model
# parameters remain replicated — use ZeRO-3 if the model itself doesn't fit.
#
# This preset inherits from large_backbone and adjusts defaults for DeepSpeed.

defaults:
  - joint

# Override defaults suitable for DeepSpeed
batch_size: 2
gradient_accumulation_steps: 4
use_gradient_checkpointing: true
use_gradient_checkpointing_offload: false
initialize_model_on_cpu: true

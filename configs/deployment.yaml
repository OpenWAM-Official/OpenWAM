deployment:
  # Default checkpoint directory; --ckpt-dir on the CLI overrides this.
  checkpoint_path: null
  device: cuda:0
  server:
    host: "0.0.0.0"
    ws_port: 8850
    http_port: 8848

project:
  name: open-wam
  seed: 42

# ---------------------------------------------------------------------------
# Inference parameters
# These populate cfg.inference and are used by JointInferenceEngine.generate().
# CLI flags --denoise-steps / --schedule-type etc. override these values.
# ---------------------------------------------------------------------------
inference:
  denoise_steps: 20           # Denoising steps (FastWAM uses 10; OpenWAM default was 20)
  schedule_type: sync         # sync | video_leading | cascade | decoupled_flash | decoupled_asymmetric
  cfg_scale: 1.0              # Classifier-Free Guidance scale (1.0 = disabled, recommended for robotics)
  shift: 5.0                  # Flow-matching shift parameter

# ---------------------------------------------------------------------------
# Deploy-time optimizations
# Read by JointInferenceEngine._init_optimizations() via cfg.deploy.
# ---------------------------------------------------------------------------
deploy:
  decode_video: false          # Set false to skip VAE decode (action-only mode)

  schedule:
    type: null                # Override inference.schedule_type at deploy time (null = use inference.schedule_type)
    action_steps: 4           # Action denoising steps for decoupled_flash / decoupled_asymmetric schedules

  dit_cache:
    enabled: false            # DiT velocity cache: skip video DiT when prediction is stable
    cosine_threshold: 0.99    # Skip if cosine similarity to previous prediction exceeds this
    max_skips: 3              # Maximum consecutive skips before forcing recompute

  cfg:
    mode: null                # null | batch_merge | parallel  (only relevant if inference.cfg_scale > 1.0)
    devices: null             # List like [cuda:0, cuda:1] for mode=parallel; must be set then

  compile:
    enabled: true            # torch.compile ActionDiT (safe, already validated)
    video_dit: true          # torch.compile Video DiT (5B) — long warmup (~5 min)
    vae: false                # torch.compile VAE decoder — only effective when tiled=false， not need if decode_video is false

  prompt_embed_cache:
    maxsize: 32               # LRU cap for (prompt, neg_prompt) -> text embeddings cache

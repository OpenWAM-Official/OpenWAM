name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check openwam/ scripts/ tests/

  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.7.1 torchvision==0.22.1
          python -m pip install -e .
          python -m pip install pytest

      - name: Run standard checks
        run: make check

      - name: Enforce train/eval import boundary
        run: |
          if git grep -nE '^from benchmarks|^import benchmarks' -- openwam; then
            echo 'openwam must not import benchmarks' >&2
            exit 1
          fi

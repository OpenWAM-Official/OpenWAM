[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-wam"
version = "0.1.0"
description = "OpenWAM: A Modular Open-Source Library for Systematic WAM Training, Inference and Deployment"
authors = [{ name = "OpenWAM Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
    "torch>=2.0.0,<3",
    "torchvision>=0.15,<1",
    "transformers>=5.5,<6",
    "imageio>=2.28,<3",
    "imageio[ffmpeg]>=2.28,<3",
    "safetensors>=0.4,<1",
    "einops>=0.7,<1",
    "sentencepiece>=0.1.99,<1",
    "protobuf>=4.25,<7",
    "modelscope>=1.13,<2",
    "ftfy>=6.1,<7",
    "opencv-python>=4.7,<5",
    "h5py>=3.8,<4",
    "lpips>=0.1.4,<1",
    "pandas>=2.0,<4",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<1",
    "accelerate>=1.0,<2",
    "peft>=0.10,<1",
    "datasets>=2.18,<4",
    "tqdm>=4.66,<5",
    "wandb>=0.16,<1",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "websockets>=11,<15",
    "aiohttp>=3.9,<4",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@d656da8ccca5989ff0a2207e81fbfa2c2d5bafb1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["openwam", "openwam.*"]

[project.optional-dependencies]
npu_aarch64 = ["torch==2.7.1", "torch-npu==2.7.1", "torchvision==0.22.1"]
npu = ["torch==2.7.1+cpu", "torch-npu==2.7.1", "torchvision==0.22.1+cpu"]

[tool.setuptools]
include-package-data = true

[project.scripts]
openwam-serve = "openwam.deploy.policy_server:main"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "third_party/",
    "previous_codebase/",
    "openwam/model/video_backbone/diffsynth/",
    "sandbox/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["openwam"]

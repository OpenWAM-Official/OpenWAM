[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "open-wam"
version = "0.1.0"
description = "OpenWAM: A Modular Open-Source Library for Systematic WAM Training, Inference and Deployment"
authors = [{ name = "OpenWAM Contributors" }]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.24,<3",
    "Pillow>=10,<13",
    "torch>=2.0.0,<3",
    "torchvision>=0.15,<1",
    "transformers>=5.5,<6",
    "imageio>=2.28,<3",
    "imageio[ffmpeg]>=2.28,<3",
    "joblib>=1.3,<2",
    "pyarrow>=14,<22",
    "PyYAML>=6,<7",
    "safetensors>=0.4,<1",
    "einops>=0.7,<1",
    "sentencepiece>=0.1.99,<1",
    "protobuf>=4.25,<7",
    "modelscope>=1.13,<2",
    "ftfy>=6.1,<7",
    "opencv-python>=4.7,<5",
    "h5py>=3.8,<4",
    "lpips>=0.1.4,<1",
    "pandas>=2.0,<4",
    "scipy>=1.10,<2",
    "scikit-image>=0.21,<1",
    "accelerate>=1.0,<2",
    "deepspeed>=0.18.5,<0.19",
    "peft>=0.10,<1",
    "datasets>=2.18,<4",
    "tqdm>=4.66,<5",
    "wandb>=0.16,<1",
    "hydra-core>=1.3,<2",
    "omegaconf>=2.3,<3",
    "websockets>=12,<15",
    "av>=12,<18",
    "timm>=1.0.20,<1.1",
    "lerobot @ git+https://github.com/huggingface/lerobot.git@d656da8ccca5989ff0a2207e81fbfa2c2d5bafb1",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
where = ["./"]
include = ["openwam", "openwam.*"]

[project.optional-dependencies]
# CUDA backend. Re-declares torch/torchvision so [tool.uv.sources] can route
# them to the cu128 index (a uv source `extra = "cuda"` requires the package
# to appear in this extra). cu128 is required for Blackwell (sm_120) GPUs.
# Install with: `uv sync --extra cuda --extra dev`.
cuda = ["torch>=2.0.0,<3", "torchvision>=0.15,<1"]
# NOTE: torch-npu==2.7.1 only publishes cp39/cp310/cp311 wheels, but this
# project sets requires-python>=3.12, so it is gated to <3.12 to keep uv's
# universal lock resolvable. On 3.12+ these extras install the +cpu torch but
# NOT torch-npu — i.e. Ascend NPU support currently requires Python <3.12.
npu_aarch64 = ["torch==2.7.1", "torch-npu==2.7.1; python_version < '3.12'", "torchvision==0.22.1"]
npu = ["torch==2.7.1+cpu", "torch-npu==2.7.1; python_version < '3.12'", "torchvision==0.22.1+cpu"]
# Cosmos-Predict2.5 video backbone (Cosmos25VideoBackbone).
#
# The cosmos-oss / cosmos-cuda / cosmos-predict2 distributions live as a uv
# workspace in the upstream repo and are not published on PyPI as standalone
# wheels (cosmos-oss==0.1.0 resolves to "no matching distribution found").
# We track upstream as a git submodule at third_party/cosmos-predict2.5/
# (pinned to tag v1.5.2, commit 441b8974) and install it via
# scripts/install_cosmos25.sh — pip does not support relative paths in
# pyproject.toml dependencies, so this extra stays empty as documentation
# only. CPU-only CI continues to pass without it because
# openwam/model/video_backbone/cosmos25/ lazy-imports cosmos_predict2 inside
# build_cosmos25_pipeline.
#
# To install on a CUDA host (also needs CUDA toolkit + cuDNN headers for
# transformer-engine to compile):
#     git submodule update --init third_party/cosmos-predict2.5
#     bash scripts/install_cosmos25.sh
cosmos25 = []
# Dev / test toolchain — pytest is referenced by Makefile (`make test`) and
# tests/conftest.py; ruff drives `make lint` / `make format`.
# Kept out of the base dependencies so non-dev installs stay slim.
dev = [
    "pytest>=8,<10",
    "ruff>=0.4,<1",
]

# --- uv configuration -----------------------------------------------------
# torch / torchvision ship as hardware-specific wheels that are NOT on PyPI:
#   * base install targets CUDA GPU hosts            -> cu128 index
#   * the `npu` extra pins `+cpu` local-version wheels -> pytorch-cpu index
# `torch-npu` itself is on PyPI, so it resolves from the default index.
# The two NPU extras are declared mutually conflicting so uv's universal lock
# never tries to satisfy a `+cpu` and a `+cu128` torch at the same time.
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "npu" },
    { index = "pytorch-cu128", extra = "cuda" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "npu" },
    { index = "pytorch-cu128", extra = "cuda" },
]

[tool.uv]
# The hardware backends are mutually exclusive; each routes torch to its own
# index, so they cannot share one resolution.
conflicts = [
    [{ extra = "cuda" }, { extra = "npu" }, { extra = "npu_aarch64" }],
]

[tool.setuptools]
include-package-data = true

[project.scripts]
openwam-serve = "openwam.deploy.server:main"

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "third_party/",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["openwam"]

[tool.pytest.ini_options]
# `gpu`-marked tests need a GPU + large pretrained weights (e.g. Wan2.2-TI2V-5B).
# They self-skip when assets are absent, but on a box that HAS the weights they
# would run in the core suite; the core `make test` gate deselects them via
# `-m "not gpu"`. Run them explicitly with `make test-full` or `pytest -m gpu`.
markers = [
    "gpu: requires a GPU and large pretrained model weights (deselected from core `make test`)",
]
